name: Deploy WarriorJ

on:
  push:
    branches: [main]
    paths:
      - 'WarriorJ-Website/**'
      - '.github/workflows/deploy-warriorj.yml'
  workflow_dispatch:

concurrency:
  group: warriorj-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate WarriorJ source
        shell: bash
        run: |
          set -euo pipefail
          test -f WarriorJ-Website/worker.js
          test -f WarriorJ-Website/wrangler.jsonc
          grep -q 'warriorj.atechspot.com' WarriorJ-Website/wrangler.jsonc
          grep -q 'ENTER WARRIOR J' WarriorJ-Website/worker.js
          grep -q 'Request a Quote' WarriorJ-Website/worker.js
          grep -q 'Privacy Policy' WarriorJ-Website/worker.js
          grep -q 'Returns & Custom Order Policy' WarriorJ-Website/worker.js
          grep -q 'Page Not Found' WarriorJ-Website/worker.js
          node --check WarriorJ-Website/worker.js
          echo 'WarriorJ source QA passed.'

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Deploy WarriorJ custom-domain Worker
        working-directory: WarriorJ-Website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          curl -fsS https://warriorj.atechspot.com/ > /tmp/warriorj-intro.html
          grep -q 'ENTER WARRIOR J' /tmp/warriorj-intro.html
          grep -q 'href="/shop.html"' /tmp/warriorj-intro.html
          curl -fsS https://warriorj.atechspot.com/shop.html > /tmp/warriorj-shop.html
          grep -q '25 CUSTOM PRODUCTS' /tmp/warriorj-shop.html
          grep -q 'Wear a bigger' /tmp/warriorj-shop.html
          grep -q 'Request a Quote' /tmp/warriorj-shop.html
          curl -fsS https://warriorj.atechspot.com/contact.html | grep -q 'Request a Quote'
          curl -fsS https://warriorj.atechspot.com/privacy.html | grep -q 'Privacy Policy'
          curl -fsS https://warriorj.atechspot.com/terms.html | grep -q 'Terms of Use'
          curl -fsS https://warriorj.atechspot.com/returns.html | grep -q 'Returns & Custom Order Policy'
          curl -fsS https://warriorj.atechspot.com/robots.txt | grep -q 'Sitemap:'
          curl -fsS https://warriorj.atechspot.com/sitemap.xml | grep -q '/privacy.html'
          curl -sS -o /tmp/warriorj-404.html -w '%{http_code}' https://warriorj.atechspot.com/does-not-exist | grep -q '^404$'
          grep -q 'That page left the battlefield' /tmp/warriorj-404.html
          curl -fsS https://warriorj.atechspot.com/api/health | grep -q '"legal":true'
          echo 'WarriorJ production verification passed.'
