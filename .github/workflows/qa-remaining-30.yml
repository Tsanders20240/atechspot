name: Certify Remaining 30 ATechSpot Properties

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-remaining-30.mjs'
      - '.github/workflows/qa-remaining-30.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run remaining-30 production certification
        run: node scripts/audit-remaining-30.mjs
