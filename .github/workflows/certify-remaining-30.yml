name: Certify Remaining 30 ATechSpot Properties

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/certify-remaining-30.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Strict 30-property release gate
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/targets.tsv <<'EOF'
          ATechSpot|https://www.atechspot.com/|https://www.atechspot.com/
          A+ Techucation Academy|https://atechucation.atechspot.com/|https://atechucation.atechspot.com/
          ATechSpot Creator|https://creator.atechspot.com/|https://creator.atechspot.com/
          ABC of Technology|https://www.abcoftech.atechspot.com/|https://www.abcoftech.atechspot.com/
          ABC Tech Products|https://abctechproducts.atechspot.com/|https://abctechproducts.atechspot.com/
          ATechSpot DJI|https://www.atechspot.com/dji/|https://www.atechspot.com/dji/
          A+ Automotive Technology|https://auto.atechspot.com/|https://auto.atechspot.com/
          A+ Credit Education|https://credit.atechspot.com/|https://credit.atechspot.com/
          ASCR Financial|https://ascrfinancial.atechspot.com/|https://ascrfinancial.atechspot.com/
          A Clean Sweep|https://acleansweep.atechspot.com/|https://acleansweep.atechspot.com/
          Vision of Sanders|https://visionofsanders.atechspot.com/|https://visionofsanders.atechspot.com/
          A Studio MX|https://astudiomx.atechspot.com/|https://astudiomx.atechspot.com/
          I Am Modeling|https://iammodeling.atechspot.com/|https://iammodeling.atechspot.com/
          HAZIL|https://hazil.atechspot.com/|https://hazil.atechspot.com/
          HazilFlix|https://hazilflix.atechspot.com/|https://hazilflix.atechspot.com/
          ATech Network|https://atechnetwork.atechspot.com/|https://atechnetwork.atechspot.com/
          A+ Techucation Figures|https://atechucationfigures.atechspot.com/|https://atechucationfigures.atechspot.com/
          Royal Up With The Hughes|https://royalupwiththehughes.atechspot.com/|https://royalupwiththehughes.atechspot.com/
          Mr. A Plus Portfolio|https://mraplusportfolio.atechspot.com/|https://www.mraplusportfolio.atechspot.com/
          WarriorJ|https://warriorj.atechspot.com/|https://warriorj.atechspot.com/
          ATechSpot RemoteCare|https://remotecare.atechspot.com/|https://remotecare.atechspot.com/
          ATechSpot Tech Guru|https://techguru.atechspot.com/|https://techguru.atechspot.com/
          Start|https://start.atechspot.com/|https://start.atechspot.com/
          Partners|https://partners.atechspot.com/|https://partners.atechspot.com/
          Vendor Portal|https://vendors.atechspot.com/|https://vendors.atechspot.com/
          Shop|https://shop.atechspot.com/|https://www.atechspot.com/shop
          Press / Media Center|https://press.atechspot.com/|https://press.atechspot.com/
          Developer Portal|https://developers.atechspot.com/|https://developers.atechspot.com/
          Internal Operations|https://ops.atechspot.com/|PRIVATE
          Reseller|https://reseller.atechspot.com/|https://reseller.atechspot.com/
          EOF

          total=0; green=0; review=0
          : > /tmp/report.txt
          while IFS='|' read -r name url expected; do
            total=$((total+1))
            rm -f /tmp/body /tmp/headers
            code=$(curl -L -sS --connect-timeout 10 --max-time 30 -D /tmp/headers -o /tmp/body -w '%{http_code}' "$url" || printf '000')
            final=$(curl -L -sS --connect-timeout 10 --max-time 30 -o /dev/null -w '%{url_effective}' "$url" || true)
            title=$(grep -o -i '<title>[^<]*' /tmp/body 2>/dev/null | head -n1 | sed 's/<title>//I' | tr '\n' ' ' || true)
            canonical=$(grep -o -i 'rel="canonical"[^>]*href="[^"]*"\|href="[^"]*"[^>]*rel="canonical"' /tmp/body 2>/dev/null | head -n1 | grep -o 'https\?://[^" ]*' || true)
            viewport=$(grep -qi '<meta[^>]*name="viewport"' /tmp/body && echo yes || echo no)
            status=GREEN; reason=''
            [ "$code" = 200 ] || { status=REVIEW; reason="http=$code"; }
            [ -n "$title" ] || { status=REVIEW; reason="${reason:+$reason,}missing-title"; }
            [ "$viewport" = yes ] || { status=REVIEW; reason="${reason:+$reason,}missing-viewport"; }
            if [ "$expected" = PRIVATE ]; then
              grep -qiE 'authorized personnel|login|sign in' /tmp/body || { status=REVIEW; reason="${reason:+$reason,}private-access-copy"; }
            else
              [ "$canonical" = "$expected" ] || { status=REVIEW; reason="${reason:+$reason,}canonical=$canonical expected=$expected"; }
            fi
            if [ "$status" = GREEN ]; then green=$((green+1)); else review=$((review+1)); fi
            printf '%s | %s | final=%s | canonical=%s | %s\n' "$status" "$name" "$final" "$canonical" "$reason" | tee -a /tmp/report.txt
          done < /tmp/targets.tsv
          echo "SUMMARY total=$total green=$green review=$review"
          [ "$total" -eq 30 ]
          [ "$review" -eq 0 ]