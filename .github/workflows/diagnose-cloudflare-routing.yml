name: Diagnose Cloudflare Routing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-cloudflare-routing.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Query Workers, DNS and public route signatures
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')

          echo '=== Worker custom domains matching ATechSpot ==='
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" "${auth[@]}" \
            | jq '{success, errors, result: [.result[]? | select(.hostname|contains("atechspot.com")) | {hostname,service,environment,zone_id,id}]}'

          echo '=== Worker scripts ==='
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" "${auth[@]}" \
            | jq '{success, errors, result: [.result[]? | {id,modified_on,created_on}]}'

          echo '=== Resolve zone ==='
          zone_json=$(curl -fsS "https://api.cloudflare.com/client/v4/zones?name=atechspot.com&account.id=$CLOUDFLARE_ACCOUNT_ID" "${auth[@]}")
          echo "$zone_json" | jq '{success, errors, result: [.result[]? | {id,name,status}]}'
          zone_id=$(echo "$zone_json" | jq -r '.result[0].id // empty')

          if [ -n "$zone_id" ]; then
            echo '=== Worker routes ==='
            curl -fsS "https://api.cloudflare.com/client/v4/zones/$zone_id/workers/routes" "${auth[@]}" \
              | jq '{success, errors, result: [.result[]? | select(.pattern|contains("atechspot.com")) | {id,pattern,script}]}'

            echo '=== DNS records for five SEO hosts ==='
            dns_json=$(curl -sS "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?per_page=500" "${auth[@]}" || true)
            if echo "$dns_json" | jq -e '.success == true' >/dev/null 2>&1; then
              echo "$dns_json" | jq '{success, errors, result: [.result[]? | select(.name=="atechspot.com" or .name=="www.atechspot.com" or .name=="abcoftech.atechspot.com" or .name=="atechucation.atechspot.com" or .name=="creator.atechspot.com" or .name=="abctechproducts.atechspot.com" or .name=="www.abctechproducts.atechspot.com") | {id,type,name,content,proxied,proxiable}]}'
            else
              echo "$dns_json" | jq '{success,errors}' || true
            fi
          fi

          echo '=== Pages projects availability ==='
          pages_json=$(curl -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects?per_page=100" "${auth[@]}" || true)
          echo "$pages_json" | jq '{success,errors,result_count:(.result|length? // 0)}' || true

          echo '=== Public route signatures ==='
          for url in \
            'https://abcoftech.atechspot.com/' \
            'https://abcoftech.atechspot.com/api/health' \
            'https://abcoftech.atechspot.com/free-resources/virtual-reality-coloring-page/' \
            'https://creator.atechspot.com/' \
            'https://www.abctechproducts.atechspot.com/' \
            'https://www.abctechproducts.atechspot.com/api/health'; do
            echo "--- $url"
            curl -sSIL --max-redirs 3 -A 'Mozilla/5.0' "$url" | grep -Ei '^(HTTP/|server:|location:|cf-ray:|cf-mitigated:|content-type:|x-powered-by:|vary:|link:)' | head -n 18 || true
          done
