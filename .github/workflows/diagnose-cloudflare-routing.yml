name: Diagnose Cloudflare Routing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-cloudflare-routing.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Query Workers, WAF and public route signatures
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')

          echo '=== Worker custom domains matching ATechSpot ==='
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" "${auth[@]}" \
            | jq '{success, errors, result: [.result[]? | select(.hostname|contains("atechspot.com")) | {hostname,service,environment,zone_id,id}]}'

          echo '=== Worker scripts ==='
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" "${auth[@]}" \
            | jq '{success, errors, result: [.result[]? | {id,modified_on,created_on}]}'

          echo '=== Resolve zone ==='
          zone_json=$(curl -fsS "https://api.cloudflare.com/client/v4/zones?name=atechspot.com&account.id=$CLOUDFLARE_ACCOUNT_ID" "${auth[@]}")
          echo "$zone_json" | jq '{success, errors, result: [.result[]? | {id,name,status}]}'
          zone_id=$(echo "$zone_json" | jq -r '.result[0].id // empty')

          if [ -n "$zone_id" ]; then
            echo '=== Worker routes ==='
            curl -fsS "https://api.cloudflare.com/client/v4/zones/$zone_id/workers/routes" "${auth[@]}" \
              | jq '{success, errors, result: [.result[]? | select(.pattern|contains("atechspot.com")) | {id,pattern,script}]}'

            echo '=== Zone rulesets ==='
            rulesets_json=$(curl -sS "https://api.cloudflare.com/client/v4/zones/$zone_id/rulesets" "${auth[@]}" || true)
            echo "$rulesets_json" | jq '{success,errors,result:[.result[]? | {id,name,kind,phase,version,last_updated}]}' || true
            if echo "$rulesets_json" | jq -e '.success == true' >/dev/null 2>&1; then
              echo "$rulesets_json" | jq -r '.result[]?.id' | while read -r rid; do
                [ -n "$rid" ] || continue
                echo "--- ruleset $rid"
                curl -sS "https://api.cloudflare.com/client/v4/zones/$zone_id/rulesets/$rid" "${auth[@]}" \
                  | jq '{success,errors,result:{id:.result.id,name:.result.name,kind:.result.kind,phase:.result.phase,rules:[.result.rules[]? | {id,action,description,enabled,expression,action_parameters}]}}' || true
              done
            fi
          fi

          echo '=== Public route signatures ==='
          for url in \
            'https://creator.atechspot.com/' \
            'https://creator.atechspot.com/robots.txt' \
            'https://creator.atechspot.com/sitemap.xml' \
            'https://www.atechspot.com/sitemap.xml'; do
            echo "--- $url"
            for ua in 'Mozilla/5.0' 'Googlebot/2.1 (+http://www.google.com/bot.html)' 'GSCWizard-Bot/1.0 (On-Page SEO Checker)'; do
              echo "UA: $ua"
              curl -sSIL --max-redirs 3 -A "$ua" "$url" | grep -Ei '^(HTTP/|server:|location:|cf-ray:|cf-mitigated:|content-type:)' | head -n 12 || true
            done
          done
