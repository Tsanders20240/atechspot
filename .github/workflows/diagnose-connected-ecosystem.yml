name: Diagnose Connected Ecosystem Domains

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-connected-ecosystem.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect Worker domains, Pages domains and Royal Up deployments
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          echo '=== Worker custom domains ==='
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" "${auth[@]}" | jq '{success, result:[.result[] | select(.hostname|endswith("atechspot.com")) | {hostname,service,environment,zone_name}]}'
          echo '=== Royal Up domains ==='
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/royalupwiththehughes/domains" "${auth[@]}" | jq '{success, result:[.result[] | {name,status,validation_data,verification_data}]}'
          echo '=== Royal Up deployments ==='
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/royalupwiththehughes/deployments?per_page=20" "${auth[@]}" | jq '{success,result:[.result[] | {id,environment,url,created_on,latest_stage,source,production_branch}]}'
          echo '=== DNS resolution ==='
          for h in start.atechspot.com intake.atechspot.com book.atechspot.com pay.atechspot.com support.atechspot.com help.atechspot.com shop.atechspot.com status.atechspot.com partners.atechspot.com ops.atechspot.com royalupwiththehughes.atechspot.com atechucationfigures.atechspot.com www.atechucationfigures.atechspot.com; do
            printf '%s -> ' "$h"; getent ahosts "$h" | head -n1 || echo UNRESOLVED
          done
