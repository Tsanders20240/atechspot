name: Configure ATechSpot Client Portal Environment
# portal activation retry after keep_vars

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/configure-portal-env.yml"
  workflow_dispatch:

jobs:
  configure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Configure portal variables in Production and Preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          PORTAL_SECRET="$(openssl rand -hex 32)"
          test "${#PORTAL_SECRET}" -eq 64

          cat > /tmp/portal-env.json <<JSON
          {
            "deployment_configs": {
              "production": {
                "env_vars": {
                  "PORTAL_SIGNING_SECRET": {"type":"secret_text","value":"$PORTAL_SECRET"},
                  "CLIENT_PORTAL_USERS": {"type":"plain_text","value":"aplustechucation@gmail.com"}
                }
              },
              "preview": {
                "env_vars": {
                  "PORTAL_SIGNING_SECRET": {"type":"secret_text","value":"$PORTAL_SECRET"},
                  "CLIENT_PORTAL_USERS": {"type":"plain_text","value":"aplustechucation@gmail.com"}
                }
              }
            }
          }
          JSON

          project_url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/atechspot"
          curl -sS --fail-with-body -X PATCH "$project_url"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --data @/tmp/portal-env.json > /tmp/portal-env-result.json

          test "$(jq -r '.success' /tmp/portal-env-result.json)" = "true"
          echo "Portal variables updated without printing secret values."

      - name: Verify variable names and types
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          project_url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/atechspot"
          curl -fsS             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             "$project_url" > /tmp/project.json

          for env in production preview; do
            test "$(jq -r ".result.deployment_configs.$env.env_vars.PORTAL_SIGNING_SECRET.type" /tmp/project.json)" = "secret_text"
            test "$(jq -r ".result.deployment_configs.$env.env_vars.CLIENT_PORTAL_USERS.type" /tmp/project.json)" = "plain_text"
            test "$(jq -r ".result.deployment_configs.$env.env_vars.CLIENT_PORTAL_USERS.value" /tmp/project.json)" = "aplustechucation@gmail.com"
            echo "$env: portal variable names/types verified"
          done

      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Redeploy ATechSpot with portal variables
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy . --project-name atechspot --branch main

      - name: Verify production portal endpoint is configured
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          started="$(node -e 'console.log(Date.now()-2500)')"
          code="$(curl -sS -o /tmp/portal-response.json -w '%{http_code}'             -X POST "https://www.atechspot.com/api/client-access"             -H "Content-Type: application/json"             --data "{\"Email\":\"aplustechucation@gmail.com\",\"form_started_at\":\"$started\"}")"
          cat /tmp/portal-response.json
          test "$code" = "200"
          test "$(jq -r '.configured' /tmp/portal-response.json)" = "true"
          echo "Production portal endpoint is configured and accepted the authorized client request."
