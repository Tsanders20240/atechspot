name: Deploy Rivuno

on:
  push:
    branches: [main]
    paths:
      - 'Rivuno-Website/**'
      - '.github/workflows/deploy-rivuno.yml'
  workflow_dispatch:

concurrency:
  group: rivuno-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Validate Rivuno source
        shell: bash
        run: |
          set -euo pipefail
          ROOT='Rivuno-Website'
          test -f "$ROOT/public/index.html"
          test -f "$ROOT/worker.js"
          test -f "$ROOT/wrangler.jsonc"
          grep -q 'RIVUNO' "$ROOT/public/index.html"
          grep -q 'Own the music.' "$ROOT/public/index.html"
          grep -q 'ABC of Tech' "$ROOT/public/index.html"
          grep -q 'music.amazon.com/tracks/B0979KNB2S' "$ROOT/public/index.html"
          grep -q 'music.youtube.com/watch?v=j7s5P1pVFtY' "$ROOT/public/index.html"
          grep -q 'rivuno.atechspot.com' "$ROOT/wrangler.jsonc"
          grep -q '"custom_domain": true' "$ROOT/wrangler.jsonc"
          node --check "$ROOT/worker.js"

      - name: Deploy Rivuno Worker and assets
        working-directory: Rivuno-Website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Verify Rivuno production
        shell: bash
        run: |
          set -euo pipefail
          sleep 12
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -L -sS -A 'Mozilla/5.0' -H 'Cache-Control: no-cache' -o /tmp/rivuno.html -w '%{http_code}' "https://rivuno.atechspot.com/?qa=${GITHUB_SHA}" || true)
            echo "Attempt $attempt: rivuno.atechspot.com -> $code"
            if [ "$code" = "200" ] && grep -q 'Own the music.' /tmp/rivuno.html && grep -q 'ABC of Tech' /tmp/rivuno.html; then
              break
            fi
            sleep 10
          done
          test "$code" = "200"
          grep -q 'Own the music.' /tmp/rivuno.html
          grep -q 'ABC of Tech' /tmp/rivuno.html
          grep -q 'Amazon Music' /tmp/rivuno.html
          grep -q 'YouTube Music' /tmp/rivuno.html
          grep -q 'Launch roadmap.' /tmp/rivuno.html
          grep -q 'Questions before launch.' /tmp/rivuno.html

          release_code=$(curl -L -sS -A 'Mozilla/5.0' -o /tmp/rivuno-release.html -w '%{http_code}' "https://rivuno.atechspot.com/release/abc-of-tech/")
          echo "release/abc-of-tech -> $release_code"
          test "$release_code" = "200"
          grep -q 'ABC of Tech' /tmp/rivuno-release.html
          grep -q 'Rights summary' /tmp/rivuno-release.html

          artist_code=$(curl -L -sS -A 'Mozilla/5.0' -o /tmp/rivuno-artist.html -w '%{http_code}' "https://rivuno.atechspot.com/artists/a-plus-techucation/")
          echo "artists/a-plus-techucation -> $artist_code"
          test "$artist_code" = "200"
          grep -q 'A+ Techucation' /tmp/rivuno-artist.html

          health=$(curl -L -sS -A 'Mozilla/5.0' "https://rivuno.atechspot.com/api/health")
          echo "$health"
          echo "$health" | grep -q '"ok":true'
          echo "$health" | grep -q '"property":"Rivuno"'

          headers=$(curl -sSI -A 'Mozilla/5.0' "https://rivuno.atechspot.com/")
          echo "$headers"
          echo "$headers" | grep -qi '^strict-transport-security:'
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'
          echo 'Rivuno production verified.'
