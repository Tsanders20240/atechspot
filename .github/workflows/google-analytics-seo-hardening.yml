name: Google Analytics and SEO Hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/google-analytics-seo-hardening.yml'
  workflow_dispatch:

jobs:
  harden:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch GA4 events and sitemap signals
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          ga_id = 'G-P5FFL89J6T'

          p = Path('assets/site.js')
          s = p.read_text(encoding='utf-8')
          if 'function ensureGa4()' not in s:
              marker = "  const LIVE_PAYMENTS={executiveReview:'https://book.stripe.com/3cI3cw1j00aG6X93LA6EU04'};\n"
              addition = marker + "\n  function ensureGa4(){\n    const id='G-P5FFL89J6T';\n    if(typeof window.gtag==='function')return;\n    window.dataLayer=window.dataLayer||[];\n    window.gtag=function(){window.dataLayer.push(arguments)};\n    window.gtag('js',new Date());\n    window.gtag('config',id,{send_page_view:true});\n    if(!document.querySelector('script[src*=\"googletagmanager.com/gtag/js?id='+id+'\"]')){const script=document.createElement('script');script.async=true;script.src='https://www.googletagmanager.com/gtag/js?id='+encodeURIComponent(id);document.head.appendChild(script)}\n  }\n"
              if marker not in s:
                  raise SystemExit('site.js insertion marker not found')
              s = s.replace(marker, addition, 1)

          startup = '  ensureTransparentCorporateLogo();normalizeRoutes();ensureSkipLink();ensureAccessibleHeader();enforcePrimaryCtas();wireLivePayments();'
          if startup in s and 'ensureGa4();ensureTransparentCorporateLogo()' not in s:
              s = s.replace(startup, '  ensureGa4();ensureTransparentCorporateLogo();normalizeRoutes();ensureSkipLink();ensureAccessibleHeader();enforcePrimaryCtas();wireLivePayments();', 1)

          old = "function trackFormSuccess(form){const formType=form.dataset.formType||'ATechSpot Website Form';if(typeof window.gtag==='function')window.gtag('event','form_submit_success',{form_type:formType,page_location:location.href});if(typeof window.clarity==='function')window.clarity('event','form_submit_success')}"
          new = "function trackFormSuccess(form){const formType=form.dataset.formType||'ATechSpot Website Form';if(typeof window.gtag==='function'){window.gtag('event','form_submit_success',{form_type:formType,page_location:location.href});window.gtag('event','generate_lead',{form_type:formType,page_location:location.href})}if(typeof window.clarity==='function')window.clarity('event','form_submit_success')}"
          if old in s:
              s = s.replace(old, new, 1)
          elif "'generate_lead'" not in s:
              raise SystemExit('trackFormSuccess marker not found')
          p.write_text(s, encoding='utf-8')

          changed = 0
          for p in Path('dji').rglob('index.html'):
              text = p.read_text(encoding='utf-8')
              before = text

              patterns = [
                  re.compile(r"window\.dataLayer&&window\.dataLayer\.push\(\{event:'(dji_[^']+)'(?:,([^}]*))?\}\)"),
                  re.compile(r"window\.dataLayer=window\.dataLayer\|\|\[\];window\.dataLayer\.push\(\{event:'(dji_[^']+)'(?:,([^}]*))?\}\)"),
                  re.compile(r"window\.dataLayer\.push\(\{event:'(dji_[^']+)'(?:,([^}]*))?\}\)")
              ]
              def repl(m):
                  name = m.group(1)
                  rest = (m.group(2) or '').strip()
                  params = '{' + rest + '}' if rest else '{}'
                  return "typeof window.gtag==='function'&&window.gtag('event','" + name + "'," + params + ")"
              for pattern in patterns:
                  text = pattern.sub(repl, text)

              if text != before:
                  p.write_text(text, encoding='utf-8')
                  changed += 1

          leftovers = []
          for p in Path('dji').rglob('index.html'):
              t = p.read_text(encoding='utf-8')
              if re.search(r"dataLayer\.push\(\{event:'dji_", t):
                  leftovers.append(str(p))
          if leftovers:
              raise SystemExit('Unconverted DJI dataLayer events: ' + ', '.join(leftovers))

          sm = Path('sitemap.xml')
          xml = sm.read_text(encoding='utf-8')
          xml2 = re.sub(r'\s*<url><loc>https://www\.atechspot\.com/intake/</loc></url>', '', xml, count=1)
          if xml2 == xml and 'https://www.atechspot.com/intake/' in xml:
              raise SystemExit('Could not remove noindex intake URL from sitemap')
          sm.write_text(xml2, encoding='utf-8')

          print(f'DJI files converted: {changed}')
          print('GA4 + SEO hardening complete.')
          PY

      - name: Validate hardening
        shell: bash
        run: |
          set -euo pipefail
          grep -q "function ensureGa4()" assets/site.js
          grep -q "'generate_lead'" assets/site.js
          ! grep -R "dataLayer.push({event:'dji_" dji --include='index.html'
          ! grep -q 'https://www.atechspot.com/intake/' sitemap.xml
          grep -q 'content="noindex,follow"' intake/index.html
          echo 'Google Analytics and SEO hardening assertions passed.'

      - name: Commit hardened production source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No hardening changes needed.'
            exit 0
          fi
          git config user.name 'ATechSpot SEO Automation'
          git config user.email 'atechucationllc@gmail.com'
          git add assets/site.js sitemap.xml dji
          git commit -m 'Harden GA4 conversions and indexing signals'
          git push origin HEAD:main
