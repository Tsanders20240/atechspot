name: Deploy ABC Tech Products

on:
  push:
    branches: [main]
    paths:
      - 'ABC-Tech-Products-Website/**'
      - '.github/workflows/deploy-abc-tech-products.yml'
  workflow_dispatch:

concurrency:
  group: abc-tech-products-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Verify approved campaign mockup asset
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pillow
          python ABC-Tech-Products-Website/scripts/fetch_campaign_asset.py

      - name: Validate ABC Tech Products next-gen source
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ABC-Tech-Products-Website'
          HTML="$ROOT/public/index.html"

          test -f "$HTML"
          test -f "$ROOT/public/styles.css"
          test -f "$ROOT/public/app.js"
          test -f "$ROOT/public/about/index.html"
          test -f "$ROOT/public/affiliate-disclosure/index.html"
          test -f "$ROOT/public/privacy/index.html"
          test -f "$ROOT/public/robots.txt"
          test -f "$ROOT/public/sitemap.xml"
          test -f "$ROOT/worker.js"
          test -f "$ROOT/OPERATIONS.md"
          test -f "$ROOT/COMMERCE-PLAN.md"
          test -s "$ROOT/public/assets/campaign/a-plus-tech-generation-campaign.webp"

          grep -q 'Website 5 of the 22-property ATechSpot ecosystem' "$HTML"
          grep -q 'A+ TECHUCATION × ABC TECH PRODUCTS' "$HTML"
          grep -q 'Wear the' "$HTML"
          grep -q 'THE DROP SYSTEM' "$HTML"
          grep -q 'ABC Tech Kids' "$HTML"
          grep -q 'Future Mode' "$HTML"
          grep -q 'A+ Tech Core' "$HTML"
          grep -q 'PRODUCTION ENGINE' "$HTML"
          grep -q 'Tapstitch is the production and fulfillment platform' "$HTML"
          grep -q 'ABC STYLE FINDER' "$HTML"
          grep -q 'VIRTUAL TRY-ON' "$HTML"
          grep -q 'A+ FIT PREVIEW STUDIO' "$HTML"
          grep -q 'A+ TECH LOOKBOOK' "$HTML"
          grep -q '/assets/campaign/a-plus-tech-generation-campaign.webp' "$HTML"
          grep -q 'TECH GUIDES' "$HTML"
          grep -q 'CONNECTED ECOSYSTEM' "$HTML"

          grep -q 'https://www.atechspot.com/' "$HTML"
          grep -q 'https://atechucation.atechspot.com/' "$HTML"
          grep -q 'https://creator.atechspot.com/' "$HTML"
          grep -q 'https://www.abcoftech.atechspot.com/' "$HTML"
          grep -q 'https://support.atechspot.com/' "$HTML"

          grep -q 'https://www.tapstitch.com/account/dashboard' "$ROOT/OPERATIONS.md"
          if grep -q 'tapstitch.com/account/dashboard' "$HTML"; then
            echo 'Private Tapstitch dashboard must not be exposed publicly' && exit 1
          fi

          grep -q 'abctechproducts.atechspot.com' "$ROOT/wrangler.jsonc"
          grep -q '/api/health' "$ROOT/worker.js"
          node --check "$ROOT/public/app.js"
          node --check "$ROOT/worker.js"

          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          html=Path("ABC-Tech-Products-Website/public/index.html").read_text(encoding="utf-8")
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=set(); self.hashrefs=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if d.get("id"): self.ids.add(d["id"])
                  href=d.get("href","")
                  if href.startswith("#") and len(href)>1: self.hashrefs.append(href[1:])
          p=P(); p.feed(html)
          missing=sorted(set(p.hashrefs)-p.ids)
          if missing: raise SystemExit("Broken internal anchors: "+", ".join(missing))
          print(f"ABC Tech Products internal anchor validation passed: {len(p.hashrefs)} links, {len(p.ids)} ids.")
          PY

          echo 'ABC Tech Products next-generation source assertions passed.'

      - name: Deploy dedicated custom-domain Worker
        working-directory: ABC-Tech-Products-Website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Diagnose canonical domain and key routes
        shell: bash
        continue-on-error: true
        run: |
          sleep 6
          for host in abctechproducts.atechspot.com www.abctechproducts.atechspot.com; do
            echo "=== $host ==="
            for path in / /about/ /affiliate-disclosure/ /privacy/ /robots.txt /sitemap.xml /api/health; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' "https://${host}${path}" || true)
              echo "$path -> $code"
            done
            curl -sSI "https://${host}/" | head -n 15 || true
          done


      - name: Verify live next-generation storefront
        shell: bash
        run: |
          set -euo pipefail
          sleep 4
          curl -L -fsS -A 'Mozilla/5.0' -H 'Cache-Control: no-cache' "https://abctechproducts.atechspot.com/?qa=${GITHUB_SHA}" -o /tmp/abc-products-live.html
          curl -L -fsS -A 'Mozilla/5.0' "https://abctechproducts.atechspot.com/api/health" -o /tmp/abc-products-health.json

          grep -q 'A+ TECHUCATION × ABC TECH PRODUCTS' /tmp/abc-products-live.html
          grep -q 'ABC Tech Kids' /tmp/abc-products-live.html
          grep -q 'Future Mode' /tmp/abc-products-live.html
          grep -q 'A+ Tech Core' /tmp/abc-products-live.html
          grep -q 'Tapstitch is the production and fulfillment platform' /tmp/abc-products-live.html
          grep -q 'ABC STYLE FINDER' /tmp/abc-products-live.html
          grep -q 'VIRTUAL TRY-ON' /tmp/abc-products-live.html
          grep -q 'A+ TECH LOOKBOOK' /tmp/abc-products-live.html
          code=$(curl -L -sS -A 'Mozilla/5.0' -o /dev/null -w '%{http_code}' "https://abctechproducts.atechspot.com/assets/campaign/a-plus-tech-generation-campaign.webp")
          echo "campaign asset -> $code"
          test "$code" = "200"
          grep -q 'Website 5 of the 22-property ATechSpot ecosystem' /tmp/abc-products-live.html
          if grep -q 'tapstitch.com/account/dashboard' /tmp/abc-products-live.html; then
            echo 'Private Tapstitch dashboard is exposed publicly' && exit 1
          fi
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/abc-products-health.json','utf8'));if(j.ok!==true)process.exit(1)"
          echo 'Live ABC Tech Products next-generation storefront verified.'
