name: Deploy ABC Tech Products

on:
  push:
    branches: [main]
    paths:
      - 'ABC-Tech-Products-Website/**'
      - '.github/workflows/deploy-abc-tech-products.yml'
  workflow_dispatch:

concurrency:
  group: abc-tech-products-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Verify final storefront visual assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pillow
          python ABC-Tech-Products-Website/scripts/fetch_campaign_asset.py

      - name: Validate complete ABC Tech Products storefront
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ABC-Tech-Products-Website'
          HTML="$ROOT/public/index.html"

          test -f "$HTML"
          test -f "$ROOT/public/styles.css"
          test -f "$ROOT/public/app.js"
          test -f "$ROOT/public/about/index.html"
          test -f "$ROOT/public/privacy/index.html"
          test -f "$ROOT/public/affiliate-disclosure/index.html"
          test -f "$ROOT/public/robots.txt"
          test -f "$ROOT/public/sitemap.xml"
          test -f "$ROOT/worker.js"
          test -f "$ROOT/OPERATIONS.md"
          test -f "$ROOT/COMMERCE-PLAN.md"

          test -s "$ROOT/public/assets/storefront/storefront-showcase.webp"
          test -s "$ROOT/public/assets/storefront/generation-campaign.webp"
          test -s "$ROOT/public/assets/storefront/abc-book-cover.webp"

          grep -q 'A+ TECHUCATION × ABC TECH PRODUCTS' "$HTML"
          grep -q 'Wear. Create.' "$HTML"
          grep -q 'FEATURED DROPS' "$HTML"
          grep -q 'Built Next Tee' "$HTML"
          grep -q 'Outcode the Ordinary Hoodie' "$HTML"
          grep -q 'Future Loading Tee' "$HTML"
          grep -q 'Bright Minds Hoodie' "$HTML"
          grep -q 'A+ TECH LOOKBOOK' "$HTML"
          grep -q 'ABC TECH KIDS' "$HTML"
          grep -q 'FUTURE MODE' "$HTML"
          grep -q 'A+ TECH CORE' "$HTML"
          grep -q 'CREATOR EDITION' "$HTML"
          grep -q 'FROM THE ACTUAL BOOK WORLD' "$HTML"
          grep -q 'PERSONALIZATION ROADMAP' "$HTML"
          grep -q 'LAUNCH WHEN READY' "$HTML"
          grep -q 'Virtual try-on deferred to Phase 2' "$HTML"
          if grep -q 'id="try-on"' "$HTML"; then echo 'Deferred try-on section must not be public' && exit 1; fi
          grep -q "window.ABC_COMMERCE_MODE='preview'" "$HTML"

          if grep -qi 'tapstitch' "$HTML"; then
            echo 'Tapstitch must remain behind the scenes on the public storefront' && exit 1
          fi

          grep -q '/assets/storefront/generation-campaign.webp' "$HTML"
          grep -q '/assets/storefront/storefront-showcase.webp' "$HTML"
          grep -q '/assets/storefront/abc-book-cover.webp' "$HTML"

          node --check "$ROOT/public/app.js"
          node --check "$ROOT/worker.js"

          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          html=Path("ABC-Tech-Products-Website/public/index.html").read_text(encoding="utf-8")
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=set(); self.refs=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if d.get("id"): self.ids.add(d["id"])
                  href=d.get("href","")
                  if href.startswith("#") and len(href)>1: self.refs.append(href[1:])
          p=P(); p.feed(html)
          missing=sorted(set(p.refs)-p.ids)
          if missing: raise SystemExit("Broken internal anchors: "+", ".join(missing))
          print(f"Internal anchors verified: {len(p.refs)} links, {len(p.ids)} ids.")
          PY

          echo 'Complete ABC Tech Products storefront source assertions passed.'

      - name: Deploy dedicated custom-domain Worker
        working-directory: ABC-Tech-Products-Website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Diagnose canonical domain and key routes
        shell: bash
        continue-on-error: true
        run: |
          sleep 6
          for host in abctechproducts.atechspot.com www.abctechproducts.atechspot.com; do
            echo "=== $host ==="
            for path in / /about/ /affiliate-disclosure/ /privacy/ /robots.txt /sitemap.xml /api/health; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' "https://${host}${path}" || true)
              echo "$path -> $code"
            done
            curl -sSI "https://${host}/" | head -n 15 || true
          done


      - name: Verify live complete storefront
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          curl -L -fsS -A 'Mozilla/5.0' -H 'Cache-Control: no-cache' "https://abctechproducts.atechspot.com/?qa=${GITHUB_SHA}" -o /tmp/abc-products-live.html
          curl -L -fsS -A 'Mozilla/5.0' "https://abctechproducts.atechspot.com/api/health" -o /tmp/abc-products-health.json

          grep -q 'A+ TECHUCATION × ABC TECH PRODUCTS' /tmp/abc-products-live.html
          grep -q 'Built Next Tee' /tmp/abc-products-live.html
          grep -q 'A+ TECH LOOKBOOK' /tmp/abc-products-live.html
          grep -q 'FROM THE ACTUAL BOOK WORLD' /tmp/abc-products-live.html
          grep -q 'LAUNCH WHEN READY' /tmp/abc-products-live.html
          grep -q 'Virtual try-on deferred to Phase 2' /tmp/abc-products-live.html
          if grep -q 'id="try-on"' /tmp/abc-products-live.html; then echo 'Deferred try-on is still public' && exit 1; fi
          if grep -qi 'tapstitch' /tmp/abc-products-live.html; then
            echo 'Tapstitch is exposed publicly' && exit 1
          fi

          for asset in /assets/storefront/generation-campaign.webp /assets/storefront/storefront-showcase.webp /assets/storefront/abc-book-cover.webp; do
            code=$(curl -L -sS -A 'Mozilla/5.0' -o /dev/null -w '%{http_code}' "https://abctechproducts.atechspot.com${asset}")
            echo "${asset} -> ${code}"
            test "${code}" = "200"
          done

          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/abc-products-health.json','utf8'));if(j.ok!==true)process.exit(1)"
          echo 'Live complete ABC Tech Products storefront verified.'
