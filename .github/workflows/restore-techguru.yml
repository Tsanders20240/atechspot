name: Restore TechGuru Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-techguru.yml'
      - 'TechGuru-Website/**'
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate TechGuru source
        shell: bash
        run: |
          set -euo pipefail
          test -f TechGuru-Website/worker.js
          test -f TechGuru-Website/wrangler.jsonc
          grep -q "ATechSpot Tech Guru" TechGuru-Website/worker.js
          grep -q "techguru.atechspot.com" TechGuru-Website/wrangler.jsonc

      - name: Detach broken Pages custom domain if present
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/techguru"
          code=$(curl -sS -o /tmp/pages-project.json -w '%{http_code}' "$base" "${auth[@]}" || true)
          if [ "$code" = "200" ] && jq -e '.success == true' /tmp/pages-project.json >/dev/null; then
            domains=$(curl -fsS "$base/domains" "${auth[@]}")
            if echo "$domains" | jq -e '.result[]? | select(.name=="techguru.atechspot.com")' >/dev/null; then
              echo "Removing broken Pages custom-domain binding..."
              curl -fsS -X DELETE "$base/domains/techguru.atechspot.com" "${auth[@]}" | tee /tmp/delete-domain.json
              jq -e '.success == true' /tmp/delete-domain.json >/dev/null
            fi
          else
            echo "No usable Pages project found; continuing with Worker restore."
          fi

      - name: Deploy TechGuru Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --config TechGuru-Website/wrangler.jsonc

      - name: Verify Worker health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            code=$(curl -L -sS --max-time 25 -o /tmp/health -w '%{http_code}' https://techguru.atechspot.com/api/health || true)
            echo "health -> $code (attempt $attempt/8)"
            if [ "$code" = "200" ] && jq -e '.ok == true and .property == "ATechSpot Tech Guru"' /tmp/health >/dev/null 2>&1; then
              break
            fi
            sleep 8
          done
          test "$code" = "200"
          jq -e '.ok == true' /tmp/health >/dev/null

      - name: Verify public TechGuru homepage
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -L -sS --max-time 25 -o /tmp/live -w '%{http_code}' https://techguru.atechspot.com/)
          echo "techguru.atechspot.com -> $code"
          test "$code" = "200"
          grep -qi '<title>ATechSpot Tech Guru' /tmp/live
          grep -qi 'Technology help that starts with the simplest safe step' /tmp/live
