name: ATechSpot Acquisition Follow-up
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
concurrency:
  group: atechspot-acquisition-tasks
  cancel-in-progress: false
jobs:
  follow-up:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Send due internal follow-up and proof tasks
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/run-acquisition.mjs
