name: Fix Creator Discovery Link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-creator-discovery.yml'
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve dedicated Creator subdomain links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/site.js')
          s=p.read_text(encoding='utf-8')
          target="if(href==='https://creator.atechspot.com/'||href==='https://creator.atechspot.com')link.setAttribute('href','/creator/');"
          if target in s:
              s=s.replace(target,'',1)
              p.write_text(s,encoding='utf-8')
          if target in p.read_text(encoding='utf-8'):
              raise SystemExit('Creator rewrite still present')
          PY
          grep -q 'href="https://creator.atechspot.com/"' creator/index.html
      - name: Commit Creator discovery fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'ATechSpot SEO Automation'
          git config user.email 'atechucationllc@gmail.com'
          git add assets/site.js
          git commit -m 'Preserve Creator subdomain discovery links'
          git push origin HEAD:main
