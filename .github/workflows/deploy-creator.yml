name: Deploy ATechSpot Creator

on:
  push:
    branches: [main]
    paths:
      - 'ATechSpot-Creator-Website/**'
      - '.github/workflows/deploy-creator.yml'
  workflow_dispatch:

concurrency:
  group: atechspot-creator-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Validate Creator 10/10 source
        shell: bash
        run: |
          set -euo pipefail
          test -f ATechSpot-Creator-Website/public/index.html
          test -f ATechSpot-Creator-Website/public/assessment/index.html
          test -f ATechSpot-Creator-Website/worker.js
          grep -q 'Turn what you create into' ATechSpot-Creator-Website/public/index.html
          grep -q 'Creator websites' ATechSpot-Creator-Website/public/index.html
          grep -q 'Monetization systems' ATechSpot-Creator-Website/public/index.html
          grep -q 'Product launches' ATechSpot-Creator-Website/public/index.html
          grep -q 'BEFORE → AFTER' ATechSpot-Creator-Website/public/index.html
          grep -q 'PORTFOLIO PROOF' ATechSpot-Creator-Website/public/index.html
          grep -q 'CREATOR PACKAGES' ATechSpot-Creator-Website/public/index.html
          grep -q 'CREATOR BUSINESS ASSESSMENT' ATechSpot-Creator-Website/public/assessment/index.html
          grep -q 'creator.atechspot.com' ATechSpot-Creator-Website/wrangler.jsonc
          grep -q '/api/creator-assessment' ATechSpot-Creator-Website/worker.js
          echo 'Creator source assertions passed.'

      - name: Deploy Creator custom-domain Worker
        working-directory: ATechSpot-Creator-Website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Verify Worker development URL
        working-directory: ATechSpot-Creator-Website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo 'Creator Worker deployed. Custom-domain health is checked separately because Cloudflare security rules can challenge GitHub runners.'

      - name: Diagnose canonical custom domain
        shell: bash
        continue-on-error: true
        run: |
          sleep 6
          for path in / /assessment/ /robots.txt /sitemap.xml /api/health; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://creator.atechspot.com${path}" || true)
            echo "$path -> $code"
          done
          curl -sSI https://creator.atechspot.com/ | head -n 25 || true
