name: Deploy ATechSpot Creator

on:
  push:
    branches: [main]
    paths:
      - 'ATechSpot-Creator-Website/**'
      - '.github/workflows/deploy-creator.yml'
  workflow_dispatch:

concurrency:
  group: atechspot-creator-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Validate Creator 10/10 source
        shell: bash
        run: |
          set -euo pipefail
          test -f ATechSpot-Creator-Website/public/index.html
          test -f ATechSpot-Creator-Website/public/assessment/index.html
          test -f ATechSpot-Creator-Website/worker.js
          grep -q 'Build digital products people can' ATechSpot-Creator-Website/public/index.html
          grep -q 'Creator websites' ATechSpot-Creator-Website/public/index.html
          grep -q 'Business Template Vault' ATechSpot-Creator-Website/public/index.html
          grep -q 'AI Visual Prompt Library' ATechSpot-Creator-Website/public/index.html
          grep -q 'Social Content Reel Library' ATechSpot-Creator-Website/public/index.html
          grep -q 'CUSTOM B2B DIGITAL PRODUCT STUDIO' ATechSpot-Creator-Website/public/index.html
          grep -q 'Website 3 of the 22-property ATechSpot ecosystem' ATechSpot-Creator-Website/public/index.html
          grep -q 'Create One for My Company' ATechSpot-Creator-Website/public/index.html
          grep -q 'Digital-product systems' ATechSpot-Creator-Website/public/index.html
          grep -q 'Business automation' ATechSpot-Creator-Website/public/index.html
          grep -q 'Launch infrastructure' ATechSpot-Creator-Website/public/index.html
          grep -q 'Create the product, brand system' ATechSpot-Creator-Website/public/index.html
          grep -q 'https://atechucation.atechspot.com/' ATechSpot-Creator-Website/public/index.html
          grep -q 'https://abcoftech.atechspot.com/' ATechSpot-Creator-Website/public/index.html
          test -f ATechSpot-Creator-Website/public/creator-2026.css
          grep -q 'CREATOR BUSINESS ASSESSMENT' ATechSpot-Creator-Website/public/assessment/index.html
          grep -q 'creator.atechspot.com' ATechSpot-Creator-Website/wrangler.jsonc
          grep -q '/api/creator-assessment' ATechSpot-Creator-Website/worker.js
          echo 'Creator source assertions passed.'

      - name: Deploy Creator custom-domain Worker
        working-directory: ATechSpot-Creator-Website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Verify Worker development URL
        working-directory: ATechSpot-Creator-Website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo 'Creator Worker deployed. Custom-domain health is checked separately because Cloudflare security rules can challenge GitHub runners.'

      - name: Diagnose canonical custom domain
        shell: bash
        continue-on-error: true
        run: |
          sleep 6
          for path in / /assessment/ /robots.txt /sitemap.xml /api/health /creator-2026.css /app.js; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://creator.atechspot.com${path}" || true)
            echo "$path -> $code"
          done
          curl -sSI https://creator.atechspot.com/ | head -n 25 || true

      - name: Verify Creator production inquiry and email delivery
        shell: bash
        run: |
          set -euo pipefail
          started=$(( $(date +%s%3N) - 3000 ))
          cat > /tmp/creator-qa.json <<EOF
          {
            "Full Name":"ATechSpot Creator Production QA",
            "Email":"aplustechucation@gmail.com",
            "Company":"ATechSpot",
            "Product Interest":"Custom B2B Digital Product",
            "Message":"Automated production QA for ATechSpot Creator custom digital product inquiry and email delivery.",
            "Preferred Timeframe":"Planning / exploring",
            "Budget Range":"Not sure yet",
            "Request Type":"ATechSpot Creator Digital Product Inquiry",
            "form_started_at":"$started",
            "website":""
          }
          EOF
          code=$(curl -sS -o /tmp/creator-qa-result.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data-binary @/tmp/creator-qa.json https://creator.atechspot.com/api/creator-contact)
          echo "Creator production inquiry -> $code"
          cat /tmp/creator-qa-result.json
          test "$code" = "200"
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/creator-qa-result.json','utf8'));if(j.ok!==true||j.confirmationSent!==true)process.exit(1)"
