name: Deploy ATechSpot Creator

on:
  push:
    branches: [main]
    paths:
      - 'ATechSpot-Creator-Website/**'
      - '.github/workflows/deploy-creator.yml'
  workflow_dispatch:

concurrency:
  group: atechspot-creator-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Validate Creator 22-ecosystem source
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ATechSpot-Creator-Website'
          HTML="$ROOT/public/index.html"
          ASSESSMENT="$ROOT/public/assessment/index.html"

          test -f "$HTML"
          test -f "$ASSESSMENT"
          test -f "$ROOT/public/styles.css"
          test -f "$ROOT/public/creator-2026.css"
          test -f "$ROOT/public/app.js"
          test -f "$ROOT/worker.js"
          test -f "$ROOT/public/robots.txt"
          test -f "$ROOT/public/sitemap.xml"

          grep -q 'Website 3 of the 22-property ATechSpot ecosystem' "$HTML"
          grep -q 'PROPERTY 03 · CREATOR BUSINESS SYSTEMS' "$HTML"
          grep -q 'THE CREATOR BUSINESS OS' "$HTML"
          grep -q 'Build the system behind' "$HTML"
          grep -q 'one specialist inside a' "$HTML"
          grep -q 'Explore All 22 Properties' "$HTML"

          grep -q 'Creator websites' "$HTML"
          grep -q 'Digital-product systems' "$HTML"
          grep -q 'Business automation' "$HTML"
          grep -q 'Launch infrastructure' "$HTML"
          grep -q 'CUSTOM B2B DIGITAL PRODUCT STUDIO' "$HTML"
          grep -q 'Business Template Vault' "$HTML"
          grep -q 'AI Visual Prompt Library' "$HTML"
          grep -q 'Social Content Reel Library' "$HTML"

          grep -q 'https://www.atechspot.com/' "$HTML"
          grep -q 'https://atechucation.atechspot.com/' "$HTML"
          grep -q 'https://www.abcoftech.atechspot.com/' "$HTML"
          grep -q 'https://abctechproducts.atechspot.com/' "$HTML"
          grep -q 'https://visionofsanders.atechspot.com/' "$HTML"
          grep -q 'https://astudiomx.atechspot.com/' "$HTML"
          grep -q 'https://atechnetwork.atechspot.com/' "$HTML"
          grep -q 'https://book.atechspot.com/' "$HTML"
          grep -q 'https://support.atechspot.com/' "$HTML"

          grep -q 'CREATOR BUSINESS ASSESSMENT' "$ASSESSMENT"
          grep -q '/#creator-os' "$ASSESSMENT"
          grep -q '/#ecosystem' "$ASSESSMENT"
          grep -q '/api/creator-assessment' "$ROOT/worker.js"
          grep -q '/api/creator-contact' "$ROOT/worker.js"
          grep -q 'creator.atechspot.com' "$ROOT/wrangler.jsonc"
          node --check "$ROOT/public/app.js"
          node --check "$ROOT/worker.js"

          grep -q '<link rel="canonical" href="https://creator.atechspot.com/">' "$HTML"
          grep -q 'ProfessionalService' "$HTML"
          grep -q 'creator.atechspot.com/assessment/' "$ROOT/public/sitemap.xml"

          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          html=Path("ATechSpot-Creator-Website/public/index.html").read_text(encoding="utf-8")
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=set(); self.links=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if d.get("id"): self.ids.add(d["id"])
                  href=d.get("href","")
                  if href.startswith("#") and len(href)>1: self.links.append(href[1:])
          p=P(); p.feed(html)
          missing=sorted(set(p.links)-p.ids)
          if missing: raise SystemExit("Broken internal anchors: "+", ".join(missing))
          print(f"Creator internal anchor validation passed: {len(p.links)} links, {len(p.ids)} ids.")
          PY

          echo 'Creator 22-ecosystem source assertions passed.'

      - name: Deploy Creator custom-domain Worker
        working-directory: ATechSpot-Creator-Website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Verify Worker development URL
        working-directory: ATechSpot-Creator-Website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo 'Creator Worker deployed. Custom-domain health is checked separately because Cloudflare security rules can challenge GitHub runners.'

      - name: Diagnose canonical custom domain
        shell: bash
        continue-on-error: true
        run: |
          sleep 6
          for path in / /assessment/ /robots.txt /sitemap.xml /api/health /creator-2026.css /app.js; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://creator.atechspot.com${path}" || true)
            echo "$path -> $code"
          done
          curl -sSI https://creator.atechspot.com/ | head -n 25 || true

      - name: Verify Creator production inquiry and email delivery
        shell: bash
        run: |
          set -euo pipefail
          started=$(( $(date +%s%3N) - 3000 ))
          cat > /tmp/creator-qa.json <<EOF
          {
            "Full Name":"ATechSpot Creator Production QA",
            "Email":"aplustechucation@gmail.com",
            "Company":"ATechSpot",
            "Product Interest":"Custom B2B Digital Product",
            "Message":"Automated production QA for ATechSpot Creator custom digital product inquiry and email delivery.",
            "Preferred Timeframe":"Planning / exploring",
            "Budget Range":"Not sure yet",
            "Request Type":"ATechSpot Creator Digital Product Inquiry",
            "form_started_at":"$started",
            "website":""
          }
          EOF
          code=$(curl -sS -o /tmp/creator-qa-result.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data-binary @/tmp/creator-qa.json https://creator.atechspot.com/api/creator-contact)
          echo "Creator production inquiry -> $code"
          cat /tmp/creator-qa-result.json
          test "$code" = "200"
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/creator-qa-result.json','utf8'));if(j.ok!==true||j.confirmationSent!==true)process.exit(1)"


      - name: Verify live Creator 22-ecosystem experience
        shell: bash
        run: |
          set -euo pipefail
          sleep 4
          curl -L -fsS -A 'Mozilla/5.0' -H 'Cache-Control: no-cache' "https://creator.atechspot.com/?qa=${GITHUB_SHA}" -o /tmp/creator-live.html
          curl -L -fsS -A 'Mozilla/5.0' -H 'Cache-Control: no-cache' "https://creator.atechspot.com/assessment/?qa=${GITHUB_SHA}" -o /tmp/creator-assessment.html
          curl -L -fsS -A 'Mozilla/5.0' "https://creator.atechspot.com/api/health" -o /tmp/creator-health.json

          grep -q 'PROPERTY 03 · CREATOR BUSINESS SYSTEMS' /tmp/creator-live.html
          grep -q 'THE CREATOR BUSINESS OS' /tmp/creator-live.html
          grep -q 'Explore All 22 Properties' /tmp/creator-live.html
          grep -q 'Business Template Vault' /tmp/creator-live.html
          grep -q 'Custom B2B Digital Product' /tmp/creator-live.html
          grep -q 'CREATOR BUSINESS ASSESSMENT' /tmp/creator-assessment.html
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/creator-health.json','utf8'));if(j.ok!==true||j.property!=='ATechSpot Creator')process.exit(1)"
          echo 'Live ATechSpot Creator 22-ecosystem experience verified.'
