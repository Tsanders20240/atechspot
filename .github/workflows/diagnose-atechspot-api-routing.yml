name: Diagnose ATechSpot API Routing

on:
  push:
    paths:
      - .github/workflows/diagnose-atechspot-api-routing.yml
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - name: Inspect secret metadata without revealing values
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          zones=$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?name=atechspot.com")
          zone_id=$(printf '%s' "$zones" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const z=j.result&&j.result[0];if(!z)process.exit(2);process.stdout.write(z.id)})")
          echo "Zone: atechspot.com ($zone_id)"
          if [ -n "${GITHUB_RESEND_API_KEY:-}" ]; then echo 'GitHub RESEND_API_KEY: configured'; else echo 'GitHub RESEND_API_KEY: not configured'; fi

          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/atechspot" -o /tmp/project.json
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/project.json','utf8'));
          const r=j.result||{};
          const p=r.deployment_configs?.preview?.env_vars?.RESEND_API_KEY;
          const prod=r.deployment_configs?.production?.env_vars?.RESEND_API_KEY;
          const summarize=v=>v?{exists:true,type:v.type||null,valuePresent:typeof v.value==='string'&&v.value.length>0,valueLength:typeof v.value==='string'?v.value.length:0}:{exists:false,type:null,valuePresent:false,valueLength:0};
          console.log('Preview RESEND_API_KEY metadata:',JSON.stringify(summarize(p)));
          console.log('Production RESEND_API_KEY metadata:',JSON.stringify(summarize(prod)));
          NODE

          echo '--- Safe production probes ---'
          for path in /api/form-health /api/intake /api/contact /api/assessment; do
            if [ "$path" = "/api/form-health" ]; then
              code=$(curl -sS -o /tmp/body -w '%{http_code}' "https://www.atechspot.com$path" || true)
            else
              code=$(curl -sS -o /tmp/body -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "https://www.atechspot.com$path" || true)
            fi
            echo "$path -> $code"
            head -c 500 /tmp/body || true
            echo
          done

      - name: Validate Resend account, domain and delivery without exposing the key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_RESEND_API_KEY:-}" ]; then
            echo 'RESEND_DIAGNOSTIC=GITHUB_SECRET_MISSING'
            exit 0
          fi

          domains_code=$(curl -sS -o /tmp/resend-domains.json -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_RESEND_API_KEY" \
            -H 'Accept: application/json' \
            https://api.resend.com/domains || true)
          echo "Resend domains endpoint -> $domains_code"
          DOMAINS_CODE="$domains_code" node - <<'NODE'
          const fs=require('fs');
          const code=Number(process.env.DOMAINS_CODE||0);
          let j={};try{j=JSON.parse(fs.readFileSync('/tmp/resend-domains.json','utf8'))}catch{}
          if(code===200){
            const rows=(j.data||[]).map(d=>({name:d.name,status:d.status,region:d.region||null}));
            console.log('Resend domains:',JSON.stringify(rows));
            const site=rows.find(d=>d.name==='atechspot.com'||d.name.endsWith('.atechspot.com'));
            console.log('RESEND_DOMAIN_STATUS='+(site?.status||'ATECHSPOT_DOMAIN_NOT_FOUND'));
          }else{
            const msg=String(j.message||j.name||'').slice(0,240);
            console.log('RESEND_DOMAINS_ERROR='+JSON.stringify({status:code,name:j.name||null,message:msg}));
          }
          NODE

          cat > /tmp/resend-test.json <<'EOF'
          {
            "from":"ATechSpot Website <onboarding@resend.dev>",
            "to":["aplustechucation@gmail.com"],
            "subject":"ATechSpot production email connection test",
            "html":"<p>ATechSpot production email connection test. If you received this, the Resend credential and recipient path are working.</p>"
          }
          EOF
          send_code=$(curl -sS -o /tmp/resend-send.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GITHUB_RESEND_API_KEY" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/resend-test.json \
            https://api.resend.com/emails || true)
          echo "Resend direct send test -> $send_code"
          SEND_CODE="$send_code" node - <<'NODE'
          const fs=require('fs');
          const code=Number(process.env.SEND_CODE||0);
          let j={};try{j=JSON.parse(fs.readFileSync('/tmp/resend-send.json','utf8'))}catch{}
          if(code>=200&&code<300){
            console.log('RESEND_DIRECT_SEND=SUCCESS');
            console.log('Resend message id present:',Boolean(j.id));
          }else{
            const msg=String(j.message||'').slice(0,260);
            console.log('RESEND_DIRECT_SEND=FAILED');
            console.log('RESEND_SEND_ERROR='+JSON.stringify({status:code,name:j.name||null,message:msg}));
          }
          NODE
