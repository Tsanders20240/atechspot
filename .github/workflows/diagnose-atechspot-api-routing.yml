name: Diagnose ATechSpot API Routing

on:
  push:
    paths:
      - .github/workflows/diagnose-atechspot-api-routing.yml
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect Cloudflare routing
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          zones=$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?name=atechspot.com")
          zone_id=$(printf '%s' "$zones" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const z=j.result&&j.result[0];if(!z)process.exit(2);process.stdout.write(z.id)})")
          echo "Zone: atechspot.com ($zone_id)"

          echo '--- Worker routes ---'
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/workers/routes" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log(JSON.stringify({success:j.success,routes:(j.result||[]).map(r=>({id:r.id,pattern:r.pattern,script:r.script}))},null,2))})" || true

          echo '--- Pages project ---'
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/atechspot" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const r=j.result||{};console.log(JSON.stringify({success:j.success,name:r.name,subdomain:r.subdomain,production_branch:r.production_branch,domains:r.domains,latest_deployment:r.latest_deployment&&{id:r.latest_deployment.id,url:r.latest_deployment.url,environment:r.latest_deployment.environment,aliases:r.latest_deployment.aliases}},null,2))})" || true

          echo '--- Pages custom domains ---'
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/atechspot/domains" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log(JSON.stringify({success:j.success,domains:(j.result||[]).map(d=>({name:d.name,status:d.status,zone_tag:d.zone_tag}))},null,2))})" || true

          echo '--- Production route probes ---'
          for u in https://www.atechspot.com/ https://www.atechspot.com/api/form-health https://atechspot.pages.dev/api/form-health; do
            code=$(curl -sS -o /tmp/body -w '%{http_code}' "$u" || true)
            echo "$u -> $code"
            head -c 700 /tmp/body || true
            echo
          done
