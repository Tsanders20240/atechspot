name: Diagnose Creator Cloudflare

on:
  push:
    paths:
      - '.github/workflows/diagnose-creator-cloudflare.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Inspect Creator DNS and Worker domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          zone_json=$(curl -fsS 'https://api.cloudflare.com/client/v4/zones?name=atechspot.com' -H "$AUTH")
          zone_id=$(echo "$zone_json" | jq -r '.result[0].id // empty')
          test -n "$zone_id"
          echo '=== WORKER CUSTOM DOMAIN ==='
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains?hostname=creator.atechspot.com" -H "$AUTH" | jq '{success, result: [.result[] | {hostname, service, zone_name, environment}]}'
          echo '=== CREATOR DNS ==='
          curl -fsS "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?name=creator.atechspot.com" -H "$AUTH" | jq '{success, result: [.result[] | {id, type, name, content, proxied, ttl, comment}]}'
          echo '=== WORKER ROUTES MATCHING CREATOR ==='
          curl -fsS "https://api.cloudflare.com/client/v4/zones/$zone_id/workers/routes" -H "$AUTH" | jq '{success, result: [.result[] | select((.pattern // "") | contains("creator")) | {id, pattern, script}]}'
          echo '=== HTTP DIAGNOSTIC ==='
          curl -sS -o /tmp/body -D /tmp/headers https://creator.atechspot.com/ || true
          head -n 30 /tmp/headers || true
          head -c 300 /tmp/body || true
