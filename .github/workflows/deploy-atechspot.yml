name: Deploy ATechSpot Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: atechspot-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: List Cloudflare Pages projects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages project list

      - name: Deploy ATechSpot to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy . --project-name atechspot --branch main

      - name: Ensure apex-to-WWW redirect rule
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')

          zone_json=$(curl -fsS "${auth[@]}" "$api/zones?name=atechspot.com")
          zone_id=$(printf '%s' "$zone_json" | jq -r '.result[0].id // empty')
          if [ -z "$zone_id" ]; then
            echo 'Could not resolve Cloudflare zone ID for atechspot.com. The token needs Zone:Read.'
            exit 1
          fi

          entry=$(curl -sS "${auth[@]}" "$api/zones/$zone_id/rulesets/phases/http_request_dynamic_redirect/entrypoint")
          ruleset_id=$(printf '%s' "$entry" | jq -r 'if .success then (.result.id // empty) else empty end')

          rule=$(jq -nc '{
            action:"redirect",
            expression:"(http.host eq \"atechspot.com\" and not starts_with(http.request.uri.path, \"/.well-known\"))",
            description:"Apex to WWW",
            enabled:true,
            action_parameters:{from_value:{status_code:301,preserve_query_string:true,target_url:{expression:"concat(\"https://www.atechspot.com\", http.request.uri.path)"}}}
          }')

          if [ -z "$ruleset_id" ]; then
            payload=$(jq -nc --argjson rule "$rule" '{name:"ATechSpot canonical redirects",description:"Canonical production redirects for ATechSpot",kind:"zone",phase:"http_request_dynamic_redirect",rules:[$rule]}')
            result=$(curl -fsS -X POST "${auth[@]}" --data "$payload" "$api/zones/$zone_id/rulesets")
            printf '%s' "$result" | jq -e '.success == true' >/dev/null
            echo 'Created dynamic redirect ruleset with Apex to WWW rule.'
          else
            existing_rule_id=$(printf '%s' "$entry" | jq -r '.result.rules[]? | select(.description == "Apex to WWW") | .id' | head -n1)
            if [ -n "$existing_rule_id" ]; then
              result=$(curl -fsS -X PATCH "${auth[@]}" --data "$rule" "$api/zones/$zone_id/rulesets/$ruleset_id/rules/$existing_rule_id")
              printf '%s' "$result" | jq -e '.success == true' >/dev/null
              echo 'Updated existing Apex to WWW rule.'
            else
              result=$(curl -fsS -X POST "${auth[@]}" --data "$rule" "$api/zones/$zone_id/rulesets/$ruleset_id/rules")
              printf '%s' "$result" | jq -e '.success == true' >/dev/null
              echo 'Added Apex to WWW rule.'
            fi
          fi

      - name: Production smoke tests
        shell: bash
        run: |
          set -euo pipefail
          sleep 12

          echo 'Checking apex canonical redirect...'
          apex_headers=$(curl -sSI https://atechspot.com/)
          printf '%s\n' "$apex_headers"
          apex_code=$(curl -sS -o /dev/null -w '%{http_code}' https://atechspot.com/)
          apex_location=$(printf '%s\n' "$apex_headers" | awk 'BEGIN{IGNORECASE=1}/^location:/{gsub("\r",""); print $2; exit}')
          test "$apex_code" = "301"
          test "$apex_location" = "https://www.atechspot.com/"

          echo 'Checking ecosystem legacy redirect...'
          eco_headers=$(curl -sSI https://www.atechspot.com/ecosystem.html)
          eco_code=$(curl -sS -o /dev/null -w '%{http_code}' https://www.atechspot.com/ecosystem.html)
          eco_location=$(printf '%s\n' "$eco_headers" | awk 'BEGIN{IGNORECASE=1}/^location:/{gsub("\r",""); print $2; exit}')
          test "$eco_code" = "301"
          test "$eco_location" = "https://www.atechspot.com/ecosystem/"

          echo 'Checking production pages...'
          for path in / /ecosystem/ /assessment/ /ai-readiness/ /intake/ /contact/ /resources/ /remote-support/; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://www.atechspot.com${path}")
            echo "$path -> $code"
            test "$code" = "200"
          done

          echo 'Checking form service health...'
          curl -fsS https://www.atechspot.com/api/form-health | tee /tmp/form-health.json
          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('/tmp/form-health.json','utf8')); if(!j.ok||!j.resendConfigured||!Array.isArray(j.publicInboxes)||j.publicInboxes.length!==6) process.exit(1);"

          echo 'All ATechSpot production smoke tests passed.'
