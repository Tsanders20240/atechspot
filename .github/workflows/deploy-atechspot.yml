name: Deploy ATechSpot Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: atechspot-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Deploy ATechSpot to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy . --project-name atechspot --branch main

      - name: Production QA
        shell: bash
        run: |
          set -euo pipefail
          sleep 12

          echo 'Apex canonical status (reported separately because this is a zone-level rule):'
          apex_code=$(curl -sS -o /dev/null -w '%{http_code}' https://atechspot.com/)
          apex_location=$(curl -sSI https://atechspot.com/ | awk 'BEGIN{IGNORECASE=1}/^location:/{gsub("\r",""); print $2; exit}')
          echo "atechspot.com -> HTTP $apex_code location=$apex_location"
          if [ "$apex_code" != "301" ] || [ "$apex_location" != "https://www.atechspot.com/" ]; then
            echo '::warning::Apex-to-WWW redirect still needs the Cloudflare zone Redirect Rule. Site deployment continues because the Pages token does not have zone Rulesets permission.'
          fi

          echo 'Checking ecosystem legacy redirect...'
          eco_code=$(curl -sS -o /dev/null -w '%{http_code}' https://www.atechspot.com/ecosystem.html)
          eco_location=$(curl -sSI https://www.atechspot.com/ecosystem.html | awk 'BEGIN{IGNORECASE=1}/^location:/{gsub("\r",""); print $2; exit}')
          test "$eco_code" = "301"
          test "$eco_location" = "https://www.atechspot.com/ecosystem/"

          echo 'Checking canonical production pages...'
          for path in / /ecosystem/ /assessment/ /ai-readiness/ /intake/ /contact/ /resources/ /remote-support/; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://www.atechspot.com${path}")
            echo "$path -> $code"
            test "$code" = "200"
          done

          echo 'Checking 22-property ecosystem content...'
          curl -fsS https://www.atechspot.com/ecosystem/ > /tmp/ecosystem.html
          grep -q '22-PROPERTY ECOSYSTEM' /tmp/ecosystem.html
          grep -q 'ATechSpot RemoteCare' /tmp/ecosystem.html
          grep -q 'ATechSpot Tech Guru' /tmp/ecosystem.html

          echo 'Checking six public contact identities...'
          curl -fsS https://www.atechspot.com/contact/ > /tmp/contact.html
          for email in jason@atechspot.com hello@atechspot.com sales@atechspot.com support@atechspot.com billing@atechspot.com legal@atechspot.com; do
            grep -q "$email" /tmp/contact.html
          done

          echo 'Checking assessment and AI readiness forms...'
          curl -fsS https://www.atechspot.com/assessment/ | grep -q 'data-endpoint="/api/assessment"'
          curl -fsS https://www.atechspot.com/ai-readiness/ | grep -q 'data-endpoint="/api/assessment"'

          echo 'Checking form service health...'
          curl -fsS https://www.atechspot.com/api/form-health | tee /tmp/form-health.json
          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('/tmp/form-health.json','utf8')); if(!j.ok||!j.resendConfigured||!Array.isArray(j.publicInboxes)||j.publicInboxes.length!==6) process.exit(1);"

          echo 'ATechSpot production QA passed. Apex redirect status is reported as a separate Cloudflare zone-level concern.'
