name: Deploy ATechSpot Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: atechspot-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Validate production source
        shell: bash
        run: |
          set -euo pipefail
          grep -q '22-PROPERTY ECOSYSTEM' ecosystem/index.html
          grep -q 'ATechSpot RemoteCare' ecosystem/index.html
          grep -q 'ATechSpot Tech Guru' ecosystem/index.html
          test -f dji/index.html
          grep -q 'Clear DJI picks for' dji/index.html
          grep -q '02 / FIVE CLEAR PICKS' dji/index.html
          grep -q 'DJI Neo 2' dji/index.html
          grep -q 'DJI Flip' dji/index.html
          grep -q 'DJI Mini 5 Pro' dji/index.html
          grep -q 'DJI Mavic 4 Pro' dji/index.html
          grep -q 'DJI Avata 360' dji/index.html
          grep -q 'U.S. LISTING CHECKED' dji/index.html
          grep -q 'DJI_Flip_in_de_winkel.jpg/1600px' dji/index.html
          grep -q 'Independent commerce and trademark disclosure' dji/index.html
          ! grep -q 'u.djicdn.com/uploads/product_recommendation/cover/' dji/index.html
          ! grep -q 'DJI STORE • AFFILIATE' dji/index.html
          ! grep -q 'clickpid=8880094' dji/index.html
          ! grep -q 'DJI Mic 3' dji/index.html
          ! grep -q 'DJI RS 5' dji/index.html
          ! grep -q 'DJI Mic Mini 2' dji/index.html
          ! grep -q 'DJI Air 3S' dji/index.html

          test -f dji/real-estate/index.html
          grep -q 'Best DJI Drone for Real Estate Photography' dji/real-estate/index.html
          grep -q 'DJI Mini 5 Pro' dji/real-estate/index.html
          grep -q 'DJI Mavic 4 Pro' dji/real-estate/index.html
          grep -q 'FAA Part 107' dji/real-estate/index.html
          grep -q 'Plan my aerial workflow' dji/real-estate/index.html
          grep -q 'https://www.atechspot.com/dji/real-estate/' sitemap.xml

          test -f dji/roofing-inspections/index.html
          grep -q 'Best DJI Drone for Roof Inspections' dji/roofing-inspections/index.html
          grep -q 'DJI Mavic 4 Pro' dji/roofing-inspections/index.html
          grep -q 'DJI Mini 5 Pro' dji/roofing-inspections/index.html
          grep -q 'Not thermal. Not structural diagnosis.' dji/roofing-inspections/index.html
          grep -q 'Plan my roofing workflow' dji/roofing-inspections/index.html
          grep -q 'https://www.atechspot.com/dji/roofing-inspections/' sitemap.xml

          test -f dji/mini-5-pro-vs-mavic-4-pro/index.html
          grep -q 'DJI Mini 5 Pro vs Mavic 4 Pro' dji/mini-5-pro-vs-mavic-4-pro/index.html
          grep -q 'DJI Mini 5 Pro' dji/mini-5-pro-vs-mavic-4-pro/index.html
          grep -q 'DJI Mavic 4 Pro' dji/mini-5-pro-vs-mavic-4-pro/index.html
          grep -q 'ATechSpot verdict' dji/mini-5-pro-vs-mavic-4-pro/index.html
          grep -q 'https://www.atechspot.com/dji/mini-5-pro-vs-mavic-4-pro/' sitemap.xml

          test -f dji/construction/index.html
          grep -q 'Best DJI Drone for Construction Progress' dji/construction/index.html
          grep -q 'DJI Mavic 4 Pro' dji/construction/index.html
          grep -q 'DJI Mini 5 Pro' dji/construction/index.html
          grep -q 'Not survey-grade by default.' dji/construction/index.html
          grep -q 'Plan my construction workflow' dji/construction/index.html
          grep -q 'https://www.atechspot.com/dji/construction/' sitemap.xml

          test -f dji/buying-guide/index.html
          grep -q 'Complete DJI Buying Guide 2026' dji/buying-guide/index.html
          grep -q 'DJI Neo 2' dji/buying-guide/index.html
          grep -q 'DJI Flip' dji/buying-guide/index.html
          grep -q 'DJI Mini 5 Pro' dji/buying-guide/index.html
          grep -q 'DJI Mavic 4 Pro' dji/buying-guide/index.html
          grep -q 'DJI Avata 360' dji/buying-guide/index.html
          grep -q '/dji/real-estate/' dji/buying-guide/index.html
          grep -q '/dji/roofing-inspections/' dji/buying-guide/index.html
          grep -q '/dji/construction/' dji/buying-guide/index.html
          grep -q '/dji/mini-5-pro-vs-mavic-4-pro/' dji/buying-guide/index.html
          grep -q 'Remote ID' dji/buying-guide/index.html
          grep -q 'Build my drone workflow' dji/buying-guide/index.html
          grep -q 'https://www.atechspot.com/dji/buying-guide/' sitemap.xml

          grep -q 'data-endpoint="/api/assessment"' assessment/index.html
          grep -q 'data-endpoint="/api/assessment"' ai-readiness/index.html
          grep -q 'data-endpoint="https://atechspot.pages.dev/api/intake"' intake/index.html
          grep -q 'https://start.atechspot.com/' resources/index.html
          test -f payments/index.html
          test -f commerce-terms/index.html
          test -f payment-success/index.html
          grep -q 'https://book.stripe.com/3cI3cw1j00aG6X93LA6EU04' assets/site.js
          grep -q 'One-time $997 charge' assets/site.js
          grep -q 'Recurring GrowthCare' terms/index.html
          grep -q 'Payments and Stripe' privacy/index.html
          for email in jason@atechspot.com hello@atechspot.com sales@atechspot.com support@atechspot.com billing@atechspot.com legal@atechspot.com; do
            grep -q "$email" contact/index.html
            grep -q "$email" _worker.js
          done
          echo 'Production source assertions passed.'

      - name: Deploy ATechSpot to Cloudflare Pages
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy . --project-name atechspot --branch main 2>&1 | tee /tmp/deploy.log
          deploy_url=$(grep -oE 'https://[a-f0-9]+\.atechspot\.pages\.dev' /tmp/deploy.log | tail -n1)
          test -n "$deploy_url"
          echo "DEPLOY_URL=$deploy_url" >> "$GITHUB_ENV"
          echo "Deployment URL: $deploy_url"

      - name: Verify deployed preview
        shell: bash
        run: |
          set -euo pipefail
          check_path() {
            local path="$1"
            local code="000"
            for attempt in 1 2 3 4 5 6 7 8; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' "$DEPLOY_URL${path}" || true)
              echo "$path -> $code (attempt $attempt/8)"
              if [ "$code" = "200" ]; then
                return 0
              fi
              sleep 5
            done
            echo "Preview route failed to become ready: $path (last status $code)"
            return 1
          }
          echo "Testing $DEPLOY_URL"
          for path in / /ecosystem/ /dji/ /dji/real-estate/ /dji/roofing-inspections/ /dji/mini-5-pro-vs-mavic-4-pro/ /dji/construction/ /dji/buying-guide/ /assessment/ /ai-readiness/ /intake/ /contact/ /resources/ /remote-support/ /payments/ /commerce-terms/ /payment-success/; do
            check_path "$path"
          done
          curl -fsS --retry 4 --retry-delay 3 --retry-all-errors "$DEPLOY_URL/ecosystem/" -o /tmp/ecosystem.html
          grep -q '22-PROPERTY ECOSYSTEM' /tmp/ecosystem.html
          grep -q 'ATechSpot RemoteCare' /tmp/ecosystem.html
          grep -q 'ATechSpot Tech Guru' /tmp/ecosystem.html
          grep -q 'WEDDING &amp; FAMILY LEGACY' /tmp/ecosystem.html
          grep -q 'INDEPENDENT APPAREL BRAND' /tmp/ecosystem.html

          curl -fsS --retry 4 --retry-delay 3 --retry-all-errors "$DEPLOY_URL/dji/" -o /tmp/dji.html
          grep -q 'Clear DJI picks for' /tmp/dji.html
          grep -q '02 / FIVE CLEAR PICKS' /tmp/dji.html
          grep -q 'DJI Neo 2' /tmp/dji.html
          grep -q 'DJI Flip' /tmp/dji.html
          grep -q 'DJI Mini 5 Pro' /tmp/dji.html
          grep -q 'DJI Mavic 4 Pro' /tmp/dji.html
          grep -q 'DJI Avata 360' /tmp/dji.html
          grep -q 'U.S. LISTING CHECKED' /tmp/dji.html
          grep -q 'DJI_Flip_in_de_winkel.jpg/1600px' /tmp/dji.html
          grep -q 'Independent commerce and trademark disclosure' /tmp/dji.html
          ! grep -q 'u.djicdn.com/uploads/product_recommendation/cover/' /tmp/dji.html
          ! grep -q 'DJI STORE • AFFILIATE' /tmp/dji.html
          ! grep -q 'clickpid=8880094' /tmp/dji.html
          ! grep -q 'DJI Mic 3' /tmp/dji.html
          ! grep -q 'DJI RS 5' /tmp/dji.html
          ! grep -q 'DJI Mic Mini 2' /tmp/dji.html
          ! grep -q 'DJI Air 3S' /tmp/dji.html

          curl -fsS --retry 4 --retry-delay 3 --retry-all-errors "$DEPLOY_URL/dji/real-estate/" -o /tmp/dji-real-estate.html
          grep -q 'Best DJI Drone for Real Estate Photography' /tmp/dji-real-estate.html
          grep -q 'DJI Mini 5 Pro' /tmp/dji-real-estate.html
          grep -q 'DJI Mavic 4 Pro' /tmp/dji-real-estate.html
          grep -q 'FAA Part 107' /tmp/dji-real-estate.html
          grep -q 'Plan my aerial workflow' /tmp/dji-real-estate.html

          curl -fsS --retry 4 --retry-delay 3 --retry-all-errors "$DEPLOY_URL/dji/roofing-inspections/" -o /tmp/dji-roofing.html
          grep -q 'Best DJI Drone for Roof Inspections' /tmp/dji-roofing.html
          grep -q 'DJI Mavic 4 Pro' /tmp/dji-roofing.html
          grep -q 'DJI Mini 5 Pro' /tmp/dji-roofing.html
          grep -q 'Not thermal. Not structural diagnosis.' /tmp/dji-roofing.html
          grep -q 'Plan my roofing workflow' /tmp/dji-roofing.html

          curl -fsS --retry 4 --retry-delay 3 --retry-all-errors "$DEPLOY_URL/dji/mini-5-pro-vs-mavic-4-pro/" -o /tmp/dji-compare.html
          grep -q 'DJI Mini 5 Pro vs Mavic 4 Pro' /tmp/dji-compare.html
          grep -q 'ATechSpot verdict' /tmp/dji-compare.html

          curl -fsS --retry 4 --retry-delay 3 --retry-all-errors "$DEPLOY_URL/dji/construction/" -o /tmp/dji-construction.html
          grep -q 'Best DJI Drone for Construction Progress' /tmp/dji-construction.html
          grep -q 'Not survey-grade by default.' /tmp/dji-construction.html
          grep -q 'Plan my construction workflow' /tmp/dji-construction.html

          curl -fsS --retry 4 --retry-delay 3 --retry-all-errors "$DEPLOY_URL/dji/buying-guide/" -o /tmp/dji-buying-guide.html
          grep -q 'Complete DJI Buying Guide 2026' /tmp/dji-buying-guide.html
          grep -q 'DJI Neo 2' /tmp/dji-buying-guide.html
          grep -q 'DJI Flip' /tmp/dji-buying-guide.html
          grep -q 'DJI Mini 5 Pro' /tmp/dji-buying-guide.html
          grep -q 'DJI Mavic 4 Pro' /tmp/dji-buying-guide.html
          grep -q 'DJI Avata 360' /tmp/dji-buying-guide.html
          grep -q 'Remote ID' /tmp/dji-buying-guide.html
          grep -q 'Build my drone workflow' /tmp/dji-buying-guide.html

          curl -fsS --retry 4 --retry-delay 3 --retry-all-errors "$DEPLOY_URL/payments/" -o /tmp/payments.html
          grep -q 'Payments &amp; Billing\|Payments & Billing' /tmp/payments.html

          # Preview deployments intentionally do not inherit the production-only
          # RESEND_API_KEY. Validate endpoint structure and routing without
          # treating MISSING_RESEND_KEY on preview as a broken production site.
          form_health_code=$(curl -sS --retry 4 --retry-delay 3 --retry-all-errors -o /tmp/form-health.json -w '%{http_code}' "$DEPLOY_URL/api/form-health" || true)
          cat /tmp/form-health.json
          echo "Preview form-health -> $form_health_code"
          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('/tmp/form-health.json','utf8')); const code=process.argv[1]; const inboxes=Array.isArray(j.publicInboxes)&&j.publicInboxes.length===6; const healthy=code==='200'&&j.ok===true&&j.resendConfigured===true; const previewExpected=code==='503'&&j.ok===false&&j.resendConfigured===false; if(!inboxes||(!healthy&&!previewExpected)) process.exit(1);" "$form_health_code"
          echo 'Deployment preview QA passed.'

      - name: Report custom-domain status
        shell: bash
        continue-on-error: true
        run: |
          echo 'GitHub runner requests to the Cloudflare custom domain may be blocked by WAF/security rules, so these checks are diagnostic only.'
          curl -sSI https://atechspot.com/ | head -n 20 || true
          curl -sSI https://www.atechspot.com/ | head -n 20 || true
          curl -sSI https://www.atechspot.com/ecosystem.html | head -n 20 || true
          curl -sSI https://www.atechspot.com/dji/ | head -n 20 || true
          curl -sSI https://www.atechspot.com/dji/real-estate/ | head -n 20 || true
          curl -sSI https://www.atechspot.com/dji/roofing-inspections/ | head -n 20 || true
          curl -sSI https://www.atechspot.com/dji/mini-5-pro-vs-mavic-4-pro/ | head -n 20 || true
          curl -sSI https://www.atechspot.com/dji/construction/ | head -n 20 || true
          curl -sSI https://www.atechspot.com/dji/buying-guide/ | head -n 20 || true
          curl -sSI https://www.atechspot.com/payments/ | head -n 20 || true