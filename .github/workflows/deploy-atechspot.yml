name: Deploy ATechSpot Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: atechspot-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Validate production source
        shell: bash
        run: |
          set -euo pipefail
          grep -q '22-PROPERTY ECOSYSTEM' ecosystem/index.html
          grep -q 'ATechSpot RemoteCare' ecosystem/index.html
          grep -q 'ATechSpot Tech Guru' ecosystem/index.html
          grep -q 'data-endpoint="/api/assessment"' assessment/index.html
          grep -q 'data-endpoint="/api/assessment"' ai-readiness/index.html
          grep -q 'data-endpoint="/api/intake"' intake/index.html
          grep -q 'https://start.atechspot.com/' resources/index.html
          for email in jason@atechspot.com hello@atechspot.com sales@atechspot.com support@atechspot.com billing@atechspot.com legal@atechspot.com; do
            grep -q "$email" contact/index.html
            grep -q "$email" _worker.js
          done
          ! grep -R -n --include='*.html' 'Opening your web email' assessment ai-readiness intake contact resources ecosystem || false
          echo 'Production source assertions passed.'

      - name: Deploy ATechSpot to Cloudflare Pages
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy . --project-name atechspot --branch main 2>&1 | tee /tmp/deploy.log
          deploy_url=$(grep -oE 'https://[a-f0-9]+\.atechspot\.pages\.dev' /tmp/deploy.log | tail -n1)
          test -n "$deploy_url"
          echo "DEPLOY_URL=$deploy_url" >> "$GITHUB_ENV"
          echo "Deployment URL: $deploy_url"

      - name: Verify deployed preview
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          echo "Testing $DEPLOY_URL"
          for path in / /ecosystem/ /assessment/ /ai-readiness/ /intake/ /contact/ /resources/ /remote-support/; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$DEPLOY_URL${path}")
            echo "$path -> $code"
            test "$code" = "200"
          done
          curl -fsS "$DEPLOY_URL/ecosystem/" | grep -q '22-PROPERTY ECOSYSTEM'
          curl -fsS "$DEPLOY_URL/ecosystem/" | grep -q 'ATechSpot RemoteCare'
          curl -fsS "$DEPLOY_URL/ecosystem/" | grep -q 'ATechSpot Tech Guru'
          curl -fsS "$DEPLOY_URL/api/form-health" | tee /tmp/form-health.json
          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('/tmp/form-health.json','utf8')); if(!j.ok||!j.resendConfigured||!Array.isArray(j.publicInboxes)||j.publicInboxes.length!==6) process.exit(1);"
          echo 'Deployment preview QA passed.'

      - name: Report custom-domain status
        shell: bash
        continue-on-error: true
        run: |
          echo 'GitHub runner requests to the Cloudflare custom domain may be blocked by WAF/security rules, so these checks are diagnostic only.'
          curl -sSI https://atechspot.com/ | head -n 20 || true
          curl -sSI https://www.atechspot.com/ | head -n 20 || true
          curl -sSI https://www.atechspot.com/ecosystem.html | head -n 20 || true
