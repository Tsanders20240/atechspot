name: Deploy ABC of Technology

on:
  push:
    branches: [main]
    paths:
      - 'ABC-of-Technology-Website/**'
      - '.github/workflows/deploy-abc-of-technology.yml'
  workflow_dispatch:

concurrency:
  group: abc-of-technology-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify approved ABC production artwork
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pillow
          python ABC-of-Technology-Website/scripts/fetch_official_assets.py


      - name: Ingest final approved author portraits
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pillow
          python ABC-of-Technology-Website/scripts/fetch_final_author_portraits.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ABC-of-Technology-Website/public/assets/authors/jason-hughes-final.webp ABC-of-Technology-Website/public/assets/authors/april-sanders-final.webp
          if ! git diff --cached --quiet; then
            git commit -m "Store final approved ABC author portraits [skip ci]"
            git push origin HEAD:main || echo "Author portrait source commit could not be pushed; continuing current deployment with built assets."
          fi

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Build portal, book and printable assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet reportlab pillow pymupdf
          python ABC-of-Technology-Website/scripts/decode_book_svg.py
          python ABC-of-Technology-Website/scripts/build_coloring.py
          python ABC-of-Technology-Website/scripts/build_coloring_preview.py
          python ABC-of-Technology-Website/scripts/build_coloring_thumbnails.py
          python ABC-of-Technology-Website/scripts/build_official_coloring.py
          python ABC-of-Technology-Website/scripts/build_stem_activities.py
          python ABC-of-Technology-Website/scripts/build_fgh_activities.py
          python ABC-of-Technology-Website/scripts/build_portal_hero.py

      - name: Validate standalone ABC portal 10/10 source
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ABC-of-Technology-Website'
          HTML="$ROOT/public/index.html"

          test -f "$HTML"
          test -f "$ROOT/worker.js"
          test -f "$ROOT/seo-worker.js"
          test -f "$ROOT/wrangler.jsonc"
          test -f "$ROOT/public/portal-2026.css"
          test -f "$ROOT/public/abc-10of10-2026.css"
          grep -q 'START YOUR ADVENTURE' "$HTML"
          grep -q 'GROWN-UP GUIDE' "$HTML"
          grep -q 'No child account required' "$HTML"
          grep -q 'abc-10of10-2026.css' "$HTML"
          grep -q 'Pick what you want to do first.' "$HTML"
          test -f "$ROOT/public/portal-2026.js"
          test -f "$ROOT/public/assets/hero/abc-home-hero.webp"
          test -f "$ROOT/public/assets/activities/battery-hunt.webp"
          test -f "$ROOT/public/assets/activities/f-floppy-flash-drive-activity.webp"
          test -f "$ROOT/public/assets/activities/g-game-controller-activity.webp"
          test -f "$ROOT/public/assets/activities/h-headphones-activity.webp"
          test -f "$ROOT/public/downloads/activities/f-floppy-flash-drive-activity.pdf"
          test -f "$ROOT/public/downloads/activities/g-game-controller-activity.pdf"
          test -f "$ROOT/public/downloads/activities/h-headphones-activity.pdf"
          test -s "$ROOT/official-coloring-src/A_Android.png"
          test -s "$ROOT/official-coloring-src/Z_Zoom.png"
          test -s "$ROOT/official-homepage-src.png"
          test -s "$ROOT/public/assets/coloring-pages/a-android.webp"
          test -s "$ROOT/public/assets/coloring-pages/z-zoom.webp"
          test -f "$ROOT/public/assets/activities/phone-stand.webp"
          test -f "$ROOT/public/downloads/activities/battery-hunt.pdf"
          test -f "$ROOT/public/downloads/activities/phone-stand.pdf"
          node --check "$ROOT/worker.js"
          node --check "$ROOT/public/portal-2026.js"

          # Portal and ecosystem identity.
          grep -q 'Website 4 of 22' "$HTML"
          grep -q 'Start the A–Z Adventure' "$HTML"
          grep -q 'Choose your path.' "$HTML"
          grep -q 'data-world="explore"' "$HTML"
          grep -q 'data-world="learn"' "$HTML"
          grep -q 'data-world="create"' "$HTML"
          grep -q 'data-world="imagine"' "$HTML"
          grep -q 'data-world="belong"' "$HTML"
          grep -q 'portal-2026.css' "$HTML"
          grep -q 'portal-2026.js' "$HTML"
          grep -q 'https://creator.atechspot.com/' "$HTML"
          grep -q 'https://abctechproducts.atechspot.com/' "$HTML"

          # Standalone external purchase portal.
          grep -q 'Purchases open on the seller' "$HTML"
          grep -q 'amazon.com' "$HTML"
          grep -q 'audible.com' "$HTML"
          grep -q 'store.bookbaby.com' "$HTML"
          grep -q 'ABC Tech Products' "$HTML"

          # Core learning experiences remain intact.
          grep -q 'book-page-title.webp' "$HTML"
          grep -q 'book-page-best-you.webp' "$HTML"
          grep -q 'ACTUAL SUPPLIED BOOK PAGES' "$HTML"
          if grep -q 'preview-f-floppy-flash.svg\|preview-f-flash-facts.svg\|preview-gh-game-headphones.svg' "$HTML"; then
            echo 'Recreated fake book pages are still referenced' && exit 1
          fi
          grep -q 'f-floppy-flash-drive-activity.pdf' "$HTML"
          grep -q 'g-game-controller-activity.pdf' "$HTML"
          grep -q 'h-headphones-activity.pdf' "$HTML"
          grep -q 'battery-hunt.pdf' "$HTML"
          grep -q 'phone-stand.pdf' "$HTML"
          grep -q 'A–Z Quiz' "$HTML"
          grep -q 'SPELLING BEE' "$HTML"
          grep -q '26 printable coloring adventures' "$HTML"
          grep -q 'jason-hughes-final.webp' "$HTML"
          grep -q 'april-sanders-final.webp' "$HTML"
          grep -q 'id="siteIntro"' "$HTML"
          grep -q 'A+ TECHUCATION PRESENTS' "$HTML"
          grep -q 'id="soundDock"' "$HTML"
          grep -q 'id="lyricStage"' "$HTML"
          grep -q 'id="lyricVideo"' "$HTML"
          grep -q 'ognkzi0FCmU' "$HTML"
          grep -q 'id="introVideo"' "$HTML"
          grep -q 'VqeOgsVCKpc' "$HTML"
          grep -q 'id="siteLangEn"' "$HTML"
          grep -q 'id="siteLangEs"' "$HTML"
          grep -q 'hero-hotspots-art' "$HTML"
          grep -q 'OFFICIAL SUPPLIED ARTWORK' "$HTML"
          grep -q 'id="introLights"' "$HTML"
          grep -q 'ABC Tech Theme' "$HTML"
          grep -q 'id="siteControlBar"' "$HTML"
          grep -q 'COLORING WORLD' "$HTML"
          grep -q 'All 26 PDF' "$HTML"
          grep -q '/assets/coloring-pages/a-android.webp' "$HTML"
          if grep -q 'live-tool-dock' "$HTML"; then echo 'Duplicate bottom menu remains in HTML' && exit 1; fi

          test -f "$ROOT/public/assets/book/book-cover.webp"
          test -f "$ROOT/public/assets/book/preview-page-1.svg"
          test -f "$ROOT/public/assets/book/preview-page-2.svg"
          test -f "$ROOT/public/assets/book/preview-page-3.svg"
          test -f "$ROOT/public/assets/book/book-page-title.webp"
          test -f "$ROOT/public/assets/book/book-page-best-you.webp"
          test -s "$ROOT/public/assets/authors/jason-hughes-final.webp"
          test -s "$ROOT/public/assets/authors/april-sanders-final.webp"
          test -f "$ROOT/public/downloads/coloring-pages/abc-technology-coloring-pages-a-z-26-pages.pdf"
          test -f "$ROOT/public/downloads/coloring-pages/A-J_Tech_Coloring_Pages.zip"
          test -f "$ROOT/public/downloads/coloring-pages/K-T_Tech_Coloring_Pages.zip"
          test -f "$ROOT/public/downloads/coloring-pages/U-Z_Tech_Coloring_Pages.zip"
          test -f "$ROOT/public/downloads/coloring-pages/ABC_Tech_Coloring_Pages_A-Z_26_Page_Combined.zip"
          test -f "$ROOT/public/downloads/activities/keyboard-key-hunt.pdf"
          test -f "$ROOT/public/downloads/activities/laptop-parts-match.pdf"
          test -f "$ROOT/public/downloads/activities/mouse-click-maze.pdf"
          test -f "$ROOT/public/downloads/activities/wifi-signal-path.pdf"
          test -f "$ROOT/public/assets/activities/keyboard-key-hunt.webp"
          test -f "$ROOT/public/assets/activities/laptop-parts-match.webp"
          test -f "$ROOT/public/assets/activities/mouse-click-maze.webp"
          test -f "$ROOT/public/assets/activities/wifi-signal-path.webp"
          grep -q "Android" "$ROOT/public/portal-2026.js"
          grep -q "Bitcoin" "$ROOT/public/portal-2026.js"
          grep -q "Cache" "$ROOT/public/portal-2026.js"
          grep -q "XTC" "$ROOT/public/portal-2026.js"
          grep -q "A-J_Tech_Coloring_Pages.zip" "$HTML"
          grep -q "ABC_Tech_Coloring_Pages_A-Z_26_Page_Combined.zip" "$HTML"
          grep -q "Jason L. Hughes" "$HTML"
          grep -q "April M. Sanders" "$HTML"
          test "$(find "$ROOT/public/downloads/coloring-pages" -maxdepth 1 -type f -name '[a-z]-*.pdf' | wc -l)" -eq 26

          # This property intentionally uses external purchase links only.
          if grep -Eqi 'stripe|paypal|card number|checkout session' "$HTML" "$ROOT/public/portal-2026.js" "$ROOT/worker.js"; then
            echo 'On-site payment or card collection code detected' && exit 1
          fi

          if grep -q '"pattern": "www.abcoftech.atechspot.com"' "$ROOT/wrangler.jsonc"; then
            echo 'www hostname must belong to Cloudflare Pages, not the redirect Worker' && exit 1
          fi
          grep -q 'abcoftech.atechspot.com' "$ROOT/wrangler.jsonc"
          grep -q 'https://www.abcoftech.atechspot.com/' "$HTML"

          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          html=Path("ABC-of-Technology-Website/public/index.html").read_text(encoding="utf-8")
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=set(); self.hashrefs=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if d.get("id"): self.ids.add(d["id"])
                  href=d.get("href","")
                  if href.startswith("#") and len(href)>1: self.hashrefs.append(href[1:])
          p=P(); p.feed(html)
          missing=sorted(set(p.hashrefs)-p.ids)
          if missing:
              raise SystemExit("Broken internal anchors: "+", ".join(missing))
          print(f"Internal anchor validation passed: {len(p.hashrefs)} hash links, {len(p.ids)} ids.")
          PY

          echo 'ABC standalone A-Z ecosystem portal source assertions passed.'

      - name: Deploy non-www redirect Worker
        working-directory: ABC-of-Technology-Website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Deploy ABC public site to Cloudflare Pages
        working-directory: ABC-of-Technology-Website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest pages deploy public \
            --project-name=abcoftechatechspot \
            --branch=main \
            --commit-hash="$GITHUB_SHA"

      - name: Attach www hostname to ABC Pages project
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          project='abcoftechatechspot'
          domain='www.abcoftech.atechspot.com'
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project/domains"

          echo "Checking Pages project custom domains."
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$endpoint" -o /tmp/abc-pages-domains.json
          jq -e '.success == true' /tmp/abc-pages-domains.json >/dev/null

          if jq -e --arg domain "$domain" '.result[]? | select(.name == $domain)' /tmp/abc-pages-domains.json >/dev/null; then
            echo "$domain is already attached to $project."
          else
            echo "Attaching $domain to Pages project $project."
            curl -fsS -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "$endpoint" \
              --data "{"name":"$domain"}" \
              -o /tmp/abc-pages-domain-create.json
            cat /tmp/abc-pages-domain-create.json
            jq -e '.success == true' /tmp/abc-pages-domain-create.json >/dev/null
          fi

          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$endpoint" -o /tmp/abc-pages-domains-after.json
          jq -r --arg domain "$domain" '.result[]? | select(.name == $domain) | "Pages domain status: \(.status); validation: \(.validation_data.status // "unknown"); verification: \(.verification_data.status // "unknown")"' /tmp/abc-pages-domains-after.json

      - name: Verify canonical production routes
        shell: bash
        run: |
          set -euo pipefail
          sleep 10
          pages_code=$(curl -L -sS -A 'Mozilla/5.0' -o /tmp/abc-pages-origin.html -w '%{http_code}' "https://abcoftechatechspot.pages.dev/?qa=$GITHUB_SHA")
          echo "Pages origin -> $pages_code"
          test "$pages_code" = "200"
          grep -q 'START YOUR ADVENTURE' /tmp/abc-pages-origin.html
          grep -q 'GROWN-UP GUIDE' /tmp/abc-pages-origin.html
          for path in / /robots.txt /sitemap.xml /api/health /portal-2026.css /portal-2026.js /assets/hero/abc-home-hero.webp /assets/activities/battery-hunt.webp /assets/activities/f-floppy-flash-drive-activity.webp /assets/activities/g-game-controller-activity.webp /assets/activities/h-headphones-activity.webp /assets/coloring-pages/a-android.webp /assets/coloring-pages/z-zoom.webp /assets/activities/phone-stand.webp /downloads/activities/battery-hunt.pdf /downloads/activities/phone-stand.pdf /downloads/activities/f-floppy-flash-drive-activity.pdf /downloads/activities/g-game-controller-activity.pdf /downloads/activities/h-headphones-activity.pdf /downloads/coloring-pages/a-android.pdf /downloads/coloring-pages/abc-technology-coloring-pages-a-z-26-pages.pdf /assets/book/book-cover.webp /assets/book/book-page-title.webp /assets/book/book-page-best-you.webp  /assets/authors/april-sanders-final.webp; do
            code=$(curl -L -sS -A 'Mozilla/5.0' -o /dev/null -w '%{http_code}' "https://www.abcoftech.atechspot.com${path}")
            echo "$path -> $code"
            test "$code" = "200"
          done

      - name: Verify non-www redirects to www canonical
        shell: bash
        run: |
          set -euo pipefail
          location=$(curl -sSI "https://abcoftech.atechspot.com/" | awk 'BEGIN{IGNORECASE=1}/^location:/{gsub("\r","");print $2;exit}')
          echo "non-www redirect -> $location"
          test "$location" = "https://www.abcoftech.atechspot.com/"

      - name: Verify live standalone ABC portal
        shell: bash
        run: |
          set -euo pipefail
          curl -L -sS -A 'Mozilla/5.0' -H 'Cache-Control: no-cache' "https://www.abcoftech.atechspot.com/?qa=${GITHUB_SHA}" -o /tmp/abc-live.html
          grep -q 'Start the A–Z Adventure' /tmp/abc-live.html
          grep -q 'Choose your path.' /tmp/abc-live.html
          grep -q 'Website 4 of 22' /tmp/abc-live.html
          grep -q 'ABC Tech Products' /tmp/abc-live.html
          grep -q 'https://creator.atechspot.com/' /tmp/abc-live.html
          grep -q 'https://abctechproducts.atechspot.com/' /tmp/abc-live.html
          grep -q 'portal-2026.css' /tmp/abc-live.html
          grep -q 'abc-10of10-2026.css' /tmp/abc-live.html
          grep -q 'START YOUR ADVENTURE' /tmp/abc-live.html
          grep -q 'GROWN-UP GUIDE' /tmp/abc-live.html
          grep -q 'portal-2026.js' /tmp/abc-live.html
          grep -q 'Purchases open on the seller' /tmp/abc-live.html
          grep -q 'battery-hunt.pdf' /tmp/abc-live.html
          grep -q 'phone-stand.pdf' /tmp/abc-live.html
          grep -q 'id="siteIntro"' /tmp/abc-live.html
          grep -q 'A+ TECHUCATION PRESENTS' /tmp/abc-live.html
          grep -q 'id="soundDock"' /tmp/abc-live.html
          grep -q 'id="lyricStage"' /tmp/abc-live.html
          grep -q 'id="lyricVideo"' /tmp/abc-live.html
          grep -q 'ognkzi0FCmU' /tmp/abc-live.html
          grep -q 'id="introVideo"' /tmp/abc-live.html
          grep -q 'VqeOgsVCKpc' /tmp/abc-live.html
          grep -q 'id="siteLangEn"' /tmp/abc-live.html
          grep -q 'id="siteLangEs"' /tmp/abc-live.html
          grep -q 'id="introLights"' /tmp/abc-live.html
          grep -q 'id="siteControlBar"' /tmp/abc-live.html
          grep -q 'COLORING WORLD' /tmp/abc-live.html
          grep -q 'A-J_Tech_Coloring_Pages.zip' /tmp/abc-live.html
          grep -q 'K-T_Tech_Coloring_Pages.zip' /tmp/abc-live.html
          grep -q 'U-Z_Tech_Coloring_Pages.zip' /tmp/abc-live.html
          grep -q 'ABC_Tech_Coloring_Pages_A-Z_26_Page_Combined.zip' /tmp/abc-live.html
          grep -q 'Keyboard Key Hunt' /tmp/abc-live.html
          grep -q 'Laptop Parts Match' /tmp/abc-live.html
          grep -q 'Mouse Click Maze' /tmp/abc-live.html
          grep -q 'Wi-Fi Signal Path' /tmp/abc-live.html
          grep -q 'Jason L. Hughes' /tmp/abc-live.html
          grep -q 'April M. Sanders' /tmp/abc-live.html
          grep -q 'All 26 PDF' /tmp/abc-live.html
          grep -q 'book-page-title.webp' /tmp/abc-live.html
          grep -q 'book-page-best-you.webp' /tmp/abc-live.html
          grep -q 'ACTUAL SUPPLIED BOOK PAGES' /tmp/abc-live.html
          if grep -q 'book-page-a.webp' /tmp/abc-live.html; then echo 'Corrupted third book page is still live' && exit 1; fi
          if grep -q 'preview-f-floppy-flash.svg\|preview-f-flash-facts.svg\|preview-gh-game-headphones.svg' /tmp/abc-live.html; then
            echo 'Recreated fake book pages are live' && exit 1
          fi
          grep -q 'f-floppy-flash-drive-activity.pdf' /tmp/abc-live.html
          grep -q 'g-game-controller-activity.pdf' /tmp/abc-live.html
          grep -q 'h-headphones-activity.pdf' /tmp/abc-live.html
          if grep -q 'live-tool-dock' /tmp/abc-live.html; then echo 'Duplicate bottom menu is live' && exit 1; fi
          grep -q '/assets/coloring-pages/a-android.webp' /tmp/abc-live.html
          grep -q '/assets/coloring-pages/i-internet.webp' /tmp/abc-live.html
          for asset in /assets/authors/jason-hughes-final.webp /assets/authors/april-sanders-final.webp; do
            code=$(curl -L -sS -A 'Mozilla/5.0' -o /dev/null -w '%{http_code}' "https://www.abcoftech.atechspot.com${asset}")
            echo "${asset} -> ${code}"
            test "${code}" = "200"
          done
          echo 'Live ABC portal verified with single top navigation, actual supplied book pages, separate F/G/H activity PDFs, lyric video and 26-page coloring gallery.'
