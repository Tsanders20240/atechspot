name: Deploy ABC of Technology

on:
  push:
    branches: [main]
    paths:
      - 'ABC-of-Technology-Website/**'
      - '.github/workflows/deploy-abc-of-technology.yml'
  workflow_dispatch:

concurrency:
  group: abc-of-technology-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Build portal, book and printable assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet reportlab pillow pymupdf
          python ABC-of-Technology-Website/scripts/decode_book_svg.py
          python ABC-of-Technology-Website/scripts/build_coloring.py
          python ABC-of-Technology-Website/scripts/build_coloring_preview.py
          python ABC-of-Technology-Website/scripts/build_coloring_thumbnails.py
          python ABC-of-Technology-Website/scripts/build_stem_activities.py
          python ABC-of-Technology-Website/scripts/build_fgh_activities.py
          python ABC-of-Technology-Website/scripts/build_portal_hero.py

      - name: Validate standalone ABC portal 10/10 source
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ABC-of-Technology-Website'
          HTML="$ROOT/public/index.html"

          test -f "$HTML"
          test -f "$ROOT/worker.js"
          test -f "$ROOT/seo-worker.js"
          test -f "$ROOT/wrangler.jsonc"
          test -f "$ROOT/public/portal-2026.css"
          test -f "$ROOT/public/portal-2026.js"
          test -f "$ROOT/public/assets/hero/abc-home-hero.webp"
          test -f "$ROOT/public/assets/activities/battery-hunt.webp"
          test -f "$ROOT/public/assets/activities/f-floppy-flash-drive-activity.webp"
          test -f "$ROOT/public/assets/activities/g-game-controller-activity.webp"
          test -f "$ROOT/public/assets/activities/h-headphones-activity.webp"
          test -f "$ROOT/public/downloads/activities/f-floppy-flash-drive-activity.pdf"
          test -f "$ROOT/public/downloads/activities/g-game-controller-activity.pdf"
          test -f "$ROOT/public/downloads/activities/h-headphones-activity.pdf"
          test -f "$ROOT/public/assets/coloring-pages/a-analog-phone.webp"
          test -f "$ROOT/public/assets/coloring-pages/z-zoom.webp"
          test -f "$ROOT/public/assets/activities/phone-stand.webp"
          test -f "$ROOT/public/downloads/activities/battery-hunt.pdf"
          test -f "$ROOT/public/downloads/activities/phone-stand.pdf"
          node --check "$ROOT/worker.js"
          node --check "$ROOT/public/portal-2026.js"

          # Portal and ecosystem identity.
          grep -q 'Website 4 of 22' "$HTML"
          grep -q 'Start the A–Z Adventure' "$HTML"
          grep -q 'Choose your path.' "$HTML"
          grep -q 'data-world="explore"' "$HTML"
          grep -q 'data-world="learn"' "$HTML"
          grep -q 'data-world="create"' "$HTML"
          grep -q 'data-world="imagine"' "$HTML"
          grep -q 'data-world="belong"' "$HTML"
          grep -q 'portal-2026.css' "$HTML"
          grep -q 'portal-2026.js' "$HTML"
          grep -q 'https://creator.atechspot.com/' "$HTML"
          grep -q 'https://abctechproducts.atechspot.com/' "$HTML"

          # Standalone external purchase portal.
          grep -q 'Purchases open on the seller' "$HTML"
          grep -q 'amazon.com' "$HTML"
          grep -q 'audible.com' "$HTML"
          grep -q 'store.bookbaby.com' "$HTML"
          grep -q 'ABC Tech Products' "$HTML"

          # Core learning experiences remain intact.
          grep -q 'preview-f-floppy-flash.svg' "$HTML"
          grep -q 'preview-f-flash-facts.svg' "$HTML"
          grep -q 'preview-gh-game-headphones.svg' "$HTML"
          grep -q 'f-floppy-flash-drive-activity.pdf' "$HTML"
          grep -q 'g-game-controller-activity.pdf' "$HTML"
          grep -q 'h-headphones-activity.pdf' "$HTML"
          grep -q 'battery-hunt.pdf' "$HTML"
          grep -q 'phone-stand.pdf' "$HTML"
          grep -q 'coloring-preview-sheet.webp' "$HTML"
          grep -q 'A–Z Quiz' "$HTML"
          grep -q 'SPELLING BEE' "$HTML"
          grep -q '26 printable adventures' "$HTML"
          grep -q 'id="enBtn"' "$HTML"
          grep -q 'id="esBtn"' "$HTML"
          grep -q 'april-sanders-original-crop.webp' "$HTML"
          grep -q 'id="siteIntro"' "$HTML"
          grep -q 'A+ TECHUCATION PRESENTS' "$HTML"
          grep -q 'id="soundDock"' "$HTML"
          grep -q 'id="lyricStage"' "$HTML"
          grep -q 'id="lyricVideo"' "$HTML"
          grep -q 'ognkzi0FCmU' "$HTML"
          grep -q 'id="introVideo"' "$HTML"
          grep -q 'VqeOgsVCKpc' "$HTML"
          grep -q 'id="siteLangEn"' "$HTML"
          grep -q 'id="siteLangEs"' "$HTML"
          grep -q 'id="introLights"' "$HTML"
          grep -q 'ABC Tech Theme' "$HTML"
          grep -q 'id="siteControlBar"' "$HTML"
          grep -q 'COLORING WORLD' "$HTML"
          grep -q 'View All 26 Coloring Pages' "$HTML"
          grep -q '/assets/coloring-pages/a-analog-phone.webp' "$HTML"
          if grep -q 'live-tool-dock' "$HTML"; then echo 'Duplicate bottom menu remains in HTML' && exit 1; fi

          test -f "$ROOT/public/assets/book/book-cover.webp"
          test -f "$ROOT/public/assets/book/preview-page-1.svg"
          test -f "$ROOT/public/assets/book/preview-page-2.svg"
          test -f "$ROOT/public/assets/book/preview-page-3.svg"
          test -f "$ROOT/public/assets/book/book-page-title.webp"
          test -f "$ROOT/public/assets/book/book-page-best-you.webp"
          test -f "$ROOT/public/assets/book/book-page-a.webp"
          test -f "$ROOT/public/assets/authors/april-sanders-original-crop.webp"
          test -f "$ROOT/public/downloads/coloring-pages/abc-technology-coloring-pages-a-z-26-pages.pdf"
          test "$(find "$ROOT/public/downloads/coloring-pages" -maxdepth 1 -type f -name '[a-z]-*.pdf' | wc -l)" -eq 26

          # This property intentionally uses external purchase links only.
          if grep -Eqi 'stripe|paypal|card number|checkout session' "$HTML" "$ROOT/public/portal-2026.js" "$ROOT/worker.js"; then
            echo 'On-site payment or card collection code detected' && exit 1
          fi

          grep -q 'abcoftech.atechspot.com' "$ROOT/wrangler.jsonc"

          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          html=Path("ABC-of-Technology-Website/public/index.html").read_text(encoding="utf-8")
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=set(); self.hashrefs=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if d.get("id"): self.ids.add(d["id"])
                  href=d.get("href","")
                  if href.startswith("#") and len(href)>1: self.hashrefs.append(href[1:])
          p=P(); p.feed(html)
          missing=sorted(set(p.hashrefs)-p.ids)
          if missing:
              raise SystemExit("Broken internal anchors: "+", ".join(missing))
          print(f"Internal anchor validation passed: {len(p.hashrefs)} hash links, {len(p.ids)} ids.")
          PY

          echo 'ABC standalone A-Z ecosystem portal source assertions passed.'

      - name: Deploy dedicated custom-domain Worker
        working-directory: ABC-of-Technology-Website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Verify canonical production routes
        shell: bash
        run: |
          set -euo pipefail
          sleep 7
          for path in / /robots.txt /sitemap.xml /api/health /portal-2026.css /portal-2026.js /assets/hero/abc-home-hero.webp /assets/activities/battery-hunt.webp /assets/activities/f-floppy-flash-drive-activity.webp /assets/activities/g-game-controller-activity.webp /assets/activities/h-headphones-activity.webp /assets/coloring-pages/a-analog-phone.webp /assets/coloring-pages/z-zoom.webp /assets/activities/phone-stand.webp /downloads/activities/battery-hunt.pdf /downloads/activities/phone-stand.pdf /downloads/activities/f-floppy-flash-drive-activity.pdf /downloads/activities/g-game-controller-activity.pdf /downloads/activities/h-headphones-activity.pdf /downloads/coloring-pages/a-analog-phone.pdf /downloads/coloring-pages/abc-technology-coloring-pages-a-z-26-pages.pdf /assets/book/book-cover.webp /assets/book/book-page-title.webp /assets/book/book-page-best-you.webp /assets/book/book-page-a.webp /assets/authors/april-sanders-original-crop.webp; do
            code=$(curl -L -sS -A 'Mozilla/5.0' -o /dev/null -w '%{http_code}' "https://abcoftech.atechspot.com${path}")
            echo "$path -> $code"
            test "$code" = "200"
          done

      - name: Verify live standalone ABC portal
        shell: bash
        run: |
          set -euo pipefail
          curl -L -sS -A 'Mozilla/5.0' -H 'Cache-Control: no-cache' "https://abcoftech.atechspot.com/?qa=${GITHUB_SHA}" -o /tmp/abc-live.html
          grep -q 'Start the A–Z Adventure' /tmp/abc-live.html
          grep -q 'Choose your path.' /tmp/abc-live.html
          grep -q 'Website 4 of 22' /tmp/abc-live.html
          grep -q 'ABC Tech Products' /tmp/abc-live.html
          grep -q 'https://creator.atechspot.com/' /tmp/abc-live.html
          grep -q 'https://abctechproducts.atechspot.com/' /tmp/abc-live.html
          grep -q 'portal-2026.css' /tmp/abc-live.html
          grep -q 'portal-2026.js' /tmp/abc-live.html
          grep -q 'Purchases open on the seller' /tmp/abc-live.html
          grep -q 'battery-hunt.pdf' /tmp/abc-live.html
          grep -q 'phone-stand.pdf' /tmp/abc-live.html
          grep -q 'coloring-preview-sheet.webp' /tmp/abc-live.html
          grep -q 'preview-page-1.svg' /tmp/abc-live.html
          grep -q 'id="siteIntro"' /tmp/abc-live.html
          grep -q 'A+ TECHUCATION PRESENTS' /tmp/abc-live.html
          grep -q 'id="soundDock"' /tmp/abc-live.html
          grep -q 'id="lyricStage"' /tmp/abc-live.html
          grep -q 'id="lyricVideo"' /tmp/abc-live.html
          grep -q 'ognkzi0FCmU' /tmp/abc-live.html
          grep -q 'id="introVideo"' /tmp/abc-live.html
          grep -q 'VqeOgsVCKpc' /tmp/abc-live.html
          grep -q 'id="siteLangEn"' /tmp/abc-live.html
          grep -q 'id="siteLangEs"' /tmp/abc-live.html
          grep -q 'id="introLights"' /tmp/abc-live.html
          grep -q 'id="siteControlBar"' /tmp/abc-live.html
          grep -q 'COLORING WORLD' /tmp/abc-live.html
          grep -q 'View All 26 Coloring Pages' /tmp/abc-live.html
          grep -q 'preview-f-floppy-flash.svg' /tmp/abc-live.html
          grep -q 'preview-f-flash-facts.svg' /tmp/abc-live.html
          grep -q 'preview-gh-game-headphones.svg' /tmp/abc-live.html
          grep -q 'f-floppy-flash-drive-activity.pdf' /tmp/abc-live.html
          grep -q 'g-game-controller-activity.pdf' /tmp/abc-live.html
          grep -q 'h-headphones-activity.pdf' /tmp/abc-live.html
          if grep -q 'live-tool-dock' /tmp/abc-live.html; then echo 'Duplicate bottom menu is live' && exit 1; fi
          echo 'Live ABC portal verified with persistent navigation, intro, sound, lyric video, activities, book and Coloring World.'
