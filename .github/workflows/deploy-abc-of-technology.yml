name: Deploy ABC of Technology

on:
  push:
    branches: [main]
    paths:
      - 'ABC-of-Technology-Website/**'
      - '.github/workflows/deploy-abc-of-technology.yml'
  workflow_dispatch:

concurrency:
  group: abc-of-technology-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Build 26 printable PDFs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet reportlab pillow
          python ABC-of-Technology-Website/scripts/build_coloring.py
          python ABC-of-Technology-Website/scripts/build_coloring_preview.py

      - name: Validate bilingual 10/10 learning source
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ABC-of-Technology-Website'
          HTML="$ROOT/public/index.html"
          test -f "$HTML"
          test -f "$ROOT/worker.js"
          test -f "$ROOT/wrangler.jsonc"
          node --check "$ROOT/worker.js"

          test -f "$ROOT/public/assets/book/book-cover.webp"
          test -f "$ROOT/public/assets/book/book-bus-crop.webp"
          test -f "$ROOT/public/assets/book/book-page-title.webp"
          test -f "$ROOT/public/assets/book/book-page-best-you.webp"
          test -f "$ROOT/public/assets/book/book-page-a.webp"
          test -f "$ROOT/public/assets/authors/april-sanders-original-crop.webp"

          grep -q 'ACTUAL BOOK PREVIEW' "$HTML"
          grep -q 'book-page-title.webp' "$HTML"
          grep -q 'book-page-best-you.webp' "$HTML"
          grep -q 'book-page-a.webp' "$HTML"
          grep -q 'book-bus-crop.webp' "$HTML"
          grep -q 'TECHNOLOGY SPELLING BEE' "$HTML"
          grep -q 'STEM LEARNING' "$HTML"
          grep -q 'Español' "$HTML"
          grep -q "April M. Sanders" "$HTML"
          grep -q 'april-sanders-original-crop.webp' "$HTML"
          grep -q 'No child sign-up' "$HTML"
          grep -q 'does not collect card information or process a checkout' "$HTML"

          test -f "$ROOT/public/downloads/coloring-pages/abc-technology-coloring-pages-a-z-26-pages.pdf"
          test "$(find "$ROOT/public/downloads/coloring-pages" -maxdepth 1 -type f -name '[a-z]-*.pdf' | wc -l)" -eq 26
          test -f "$ROOT/public/assets/coloring/coloring-preview-sheet.webp"

          if grep -Eqi 'stripe|paypal|card number|checkout session' "$HTML" "$ROOT/worker.js"; then
            echo 'On-site payment code detected' && exit 1
          fi

          grep -q 'abcoftech.atechspot.com' "$ROOT/wrangler.jsonc"
          echo 'ABC of Technology bilingual STEM 10/10 source assertions passed.'

      - name: Deploy dedicated custom-domain Worker
        working-directory: ABC-of-Technology-Website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Diagnose canonical domain and key routes
        shell: bash
        continue-on-error: true
        run: |
          sleep 7
          for path in / /robots.txt /sitemap.xml /api/health /downloads/coloring-pages/a-analog-phone.pdf /downloads/coloring-pages/abc-technology-coloring-pages-a-z-26-pages.pdf /assets/book/book-cover.webp /assets/book/book-page-title.webp /assets/book/book-page-best-you.webp /assets/book/book-page-a.webp /assets/authors/april-sanders-original-crop.webp; do
            code=$(curl -L -sS -A 'Mozilla/5.0' -o /dev/null -w '%{http_code}' "https://abcoftech.atechspot.com${path}" || true)
            echo "$path -> $code"
          done
