name: Deploy ABC of Technology

on:
  push:
    branches: [main]
    paths:
      - 'ABC-of-Technology-Website/**'
      - '.github/workflows/deploy-abc-of-technology.yml'
  workflow_dispatch:

concurrency:
  group: abc-of-technology-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Validate children-first 10/10 source
        shell: bash
        run: |
          set -euo pipefail
          test -f ABC-of-Technology-Website/public/index.html
          test -f ABC-of-Technology-Website/worker.js
          test -f ABC-of-Technology-Website/wrangler.jsonc
          node --check ABC-of-Technology-Website/worker.js
          grep -q "Every letter is a" ABC-of-Technology-Website/public/index.html
          grep -q "ABC Tech Bus" ABC-of-Technology-Website/public/index.html
          grep -q "26 A–Z technology coloring activities" ABC-of-Technology-Website/public/index.html
          grep -q "No checkout lives on this children's site" ABC-of-Technology-Website/public/index.html
          grep -q "No child account" ABC-of-Technology-Website/public/index.html
          grep -q "external retailer" ABC-of-Technology-Website/public/index.html
          grep -q "abcoftech.atechspot.com" ABC-of-Technology-Website/wrangler.jsonc
          if grep -Eqi 'stripe|paypal|card number|checkout session' ABC-of-Technology-Website/public/index.html ABC-of-Technology-Website/worker.js; then echo 'On-site payment code detected' && exit 1; fi
          echo 'ABC of Technology source assertions passed.'

      - name: Deploy dedicated custom-domain Worker
        working-directory: ABC-of-Technology-Website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Diagnose canonical domain
        shell: bash
        continue-on-error: true
        run: |
          sleep 7
          for path in / /robots.txt /sitemap.xml /api/health /coloring/?letter=A; do
            code=$(curl -L -sS -A 'Mozilla/5.0' -o /dev/null -w '%{http_code}' "https://abcoftech.atechspot.com${path}" || true)
            echo "$path -> $code"
          done
          curl -sSI -A 'Mozilla/5.0' https://abcoftech.atechspot.com/ | head -n 25 || true
