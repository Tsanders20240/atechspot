name: Deploy ABC of Technology

on:
  push:
    branches: [main]
    paths:
      - 'ABC-of-Technology-Website/**'
      - '.github/workflows/deploy-abc-of-technology.yml'
  workflow_dispatch:

concurrency:
  group: abc-of-technology-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Build official book assets and 26 printable PDFs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet reportlab pillow
          python ABC-of-Technology-Website/scripts/decode_book_svg.py
          python ABC-of-Technology-Website/scripts/build_coloring.py
          python ABC-of-Technology-Website/scripts/build_coloring_preview.py

      - name: Validate bilingual 10/10 learning source
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ABC-of-Technology-Website'
          HTML="$ROOT/public/index.html"
          test -f "$HTML"
          test -f "$ROOT/worker.js"
          test -f "$ROOT/wrangler.jsonc"
          node --check "$ROOT/worker.js"

          test -f "$ROOT/public/assets/book/book-cover.webp"
          test -f "$ROOT/public/assets/book/book-bus-crop.webp"
          test -f "$ROOT/public/assets/book/book-page-title.webp"
          test -f "$ROOT/public/assets/book/book-page-best-you.webp"
          test -f "$ROOT/public/assets/book/book-page-a.webp"
          test -f "$ROOT/public/assets/authors/april-sanders-original-crop.webp"

          grep -q 'ACTUAL BOOK PREVIEW' "$HTML"
          grep -q 'book-page-title.webp' "$HTML"
          grep -q 'book-page-best-you.webp' "$HTML"
          grep -q 'book-page-a.webp' "$HTML"
          grep -q 'book-bus-crop.webp' "$HTML"
          grep -q 'TECHNOLOGY SPELLING BEE' "$HTML"
          grep -q 'STEM LEARNING' "$HTML"
          grep -q 'Español' "$HTML"
          grep -q "April M. Sanders" "$HTML"
          grep -q 'april-sanders-original-crop.webp' "$HTML"
          grep -q 'No child sign-up' "$HTML"
          grep -q 'does not collect card information or process a checkout' "$HTML"
          grep -q 'Website 4 of the 22-property ATechSpot ecosystem' "$HTML"
          grep -q 'THE A–Z ADVENTURE WORLD' "$HTML"
          grep -q 'COMPLETE THE LEARNING EXPERIENCE' "$HTML"
          grep -q 'https://creator.atechspot.com/' "$HTML"
          grep -q 'https://abctechproducts.atechspot.com/' "$HTML"
          grep -q 'Kids explore the adventure' "$HTML"
          test -f "$ROOT/public/abc-adventure-2026.css"
          test -f "$ROOT/public/abc-adventure-2026.js"
          node --check "$ROOT/public/abc-adventure-2026.js"

          test -f "$ROOT/public/downloads/coloring-pages/abc-technology-coloring-pages-a-z-26-pages.pdf"
          test "$(find "$ROOT/public/downloads/coloring-pages" -maxdepth 1 -type f -name '[a-z]-*.pdf' | wc -l)" -eq 26
          test -f "$ROOT/public/assets/coloring/coloring-preview-sheet.webp"

          if grep -Eqi 'stripe|paypal|card number|checkout session' "$HTML" "$ROOT/worker.js"; then
            echo 'On-site payment code detected' && exit 1
          fi

          grep -q 'abcoftech.atechspot.com' "$ROOT/wrangler.jsonc"
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          html=Path("ABC-of-Technology-Website/public/index.html").read_text(encoding="utf-8")
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=set(); self.hashrefs=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if d.get("id"): self.ids.add(d["id"])
                  href=d.get("href","")
                  if href.startswith("#") and len(href)>1: self.hashrefs.append(href[1:])
          p=P(); p.feed(html)
          missing=sorted(set(p.hashrefs)-p.ids)
          if missing:
              raise SystemExit("Broken internal anchors: "+", ".join(missing))
          print(f"Internal anchor validation passed: {len(p.hashrefs)} hash links, {len(p.ids)} ids.")
          PY

          echo 'ABC of Technology animated A-Z ecosystem, bilingual learning, activities and grown-up product funnel assertions passed.'

      - name: Deploy dedicated custom-domain Worker
        working-directory: ABC-of-Technology-Website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Diagnose canonical domain and key routes
        shell: bash
        continue-on-error: true
        run: |
          sleep 7
          for path in / /robots.txt /sitemap.xml /api/health /abc-adventure-2026.css /abc-adventure-2026.js /downloads/coloring-pages/a-analog-phone.pdf /downloads/coloring-pages/abc-technology-coloring-pages-a-z-26-pages.pdf /assets/book/book-cover.webp /assets/book/book-page-title.webp /assets/book/book-page-best-you.webp /assets/book/book-page-a.webp /assets/authors/april-sanders-original-crop.webp; do
            code=$(curl -L -sS -A 'Mozilla/5.0' -o /dev/null -w '%{http_code}' "https://abcoftech.atechspot.com${path}" || true)
            echo "$path -> $code"
          done

      - name: Verify live ABC adventure experience
        shell: bash
        run: |
          set -euo pipefail
          curl -L -sS -A 'Mozilla/5.0' https://abcoftech.atechspot.com/ -o /tmp/abc-live.html
          grep -q 'THE A–Z ADVENTURE WORLD' /tmp/abc-live.html
          grep -q 'COMPLETE THE LEARNING EXPERIENCE' /tmp/abc-live.html
          grep -q 'Website 4 of the 22-property ATechSpot ecosystem' /tmp/abc-live.html
          grep -q 'https://creator.atechspot.com/' /tmp/abc-live.html
          grep -q 'https://abctechproducts.atechspot.com/' /tmp/abc-live.html
          grep -q 'abc-adventure-2026.css' /tmp/abc-live.html
          grep -q 'abc-adventure-2026.js' /tmp/abc-live.html
          echo 'Live ABC of Technology adventure experience verified.'
