name: Deploy A+ Techucation

on:
  push:
    branches: [main]
    paths:
      - 'A-Techucation-Website/**'
      - '.github/workflows/deploy-atechucation.yml'
  workflow_dispatch:

concurrency:
  group: atechucation-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN repository secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret" && exit 1)

      - name: Validate A+ Techucation 10/10 source
        shell: bash
        run: |
          set -euo pipefail
          test -f A-Techucation-Website/billing/index.html
          test -f A-Techucation-Website/terms/index.html
          test -f A-Techucation-Website/privacy/index.html
          test -f A-Techucation-Website/payments-live.js
          test -f A-Techucation-Website/_headers
          grep -q 'A+ Techucation Academy' A-Techucation-Website/index.html
          grep -q 'A+ Techucation Academy' A-Techucation-Website/courses/grant-writing/index.html
          grep -q 'A+ Techucation Academy' A-Techucation-Website/courses/business-plan/index.html
          grep -q 'A+ Techucation Academy' A-Techucation-Website/courses/ecommerce/index.html
          grep -q 'A+ Techucation Academy' A-Techucation-Website/courses/reseller/index.html
          grep -q 'Technology Education for the AI Era' A-Techucation-Website/index.html
          grep -q 'AI study guides' A-Techucation-Website/index.html
          ! grep -q '24/7 AI study support' A-Techucation-Website/app.js
          grep -q 'Content-Security-Policy' A-Techucation-Website/_headers
          grep -q 'X-Frame-Options: DENY' A-Techucation-Website/_headers
          grep -q 'onboarding/\*' A-Techucation-Website/_headers
          grep -q 'payments-live.js' A-Techucation-Website/index.html
          grep -q 'https://buy.stripe.com/9B628s9Pw7D8bdpdma6EU01' A-Techucation-Website/payments-live.js
          grep -q 'https://buy.stripe.com/8x2fZi0eWg9EepBfui6EU02' A-Techucation-Website/payments-live.js
          grep -q 'https://buy.stripe.com/3cIdRa1j0bTo0yL5TI6EU03' A-Techucation-Website/payments-live.js
          grep -q 'Renews monthly until canceled' A-Techucation-Website/payments-live.js
          grep -q 'Cancel future renewals' A-Techucation-Website/billing/index.html
          grep -q 'Website 2 of the 22-property ATechSpot ecosystem' A-Techucation-Website/app.js
          grep -q 'Grant Writing & Funding' A-Techucation-Website/app.js
          grep -q 'Business Plan Course' A-Techucation-Website/app.js
          grep -q 'Ecommerce Course' A-Techucation-Website/app.js
          grep -q 'Reseller Course' A-Techucation-Website/app.js
          grep -q 'id="contact"' A-Techucation-Website/app.js
          grep -q 'https://www.atechspot.com/api/intake' A-Techucation-Website/app.js
          test -f A-Techucation-Website/ecosystem-2026.css
          grep -q 'ecosystem-2026.css' A-Techucation-Website/index.html
          grep -q '22-property ATechSpot ecosystem' A-Techucation-Website/app.js
          grep -q 'https://www.atechspot.com/ecosystem/' A-Techucation-Website/app.js
          grep -q 'https://www.atechspot.com/creator/' A-Techucation-Website/app.js
          test -f A-Techucation-Website/courses/grant-writing/index.html
          test -f A-Techucation-Website/courses/business-plan/index.html
          test -f A-Techucation-Website/courses/ecommerce/index.html
          test -f A-Techucation-Website/courses/reseller/index.html
          grep -q 'Grant Writing & Funding Course' A-Techucation-Website/courses/grant-writing/index.html
          grep -q 'Business Plan Course' A-Techucation-Website/courses/business-plan/index.html
          grep -q 'Ecommerce Course' A-Techucation-Website/courses/ecommerce/index.html
          grep -q 'Reseller Course' A-Techucation-Website/courses/reseller/index.html
          grep -q 'https://atechucation.atechspot.com/courses/grant-writing/' A-Techucation-Website/sitemap.xml
          grep -q 'https://atechucation.atechspot.com/courses/business-plan/' A-Techucation-Website/sitemap.xml
          grep -q 'https://atechucation.atechspot.com/courses/ecommerce/' A-Techucation-Website/sitemap.xml
          grep -q 'https://atechucation.atechspot.com/courses/reseller/' A-Techucation-Website/sitemap.xml
          echo 'A+ Techucation modern ecosystem, route, payment, policy and contact assertions passed.'

      - name: Deploy to Cloudflare Worker
        working-directory: A-Techucation-Website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Report canonical custom-domain status
        shell: bash
        continue-on-error: true
        run: |
          set -u
          sleep 5
          echo 'Cloudflare WAF may return 403 to GitHub-hosted runners even when the public site is healthy; these custom-domain requests are diagnostic only.'
          for path in / /business-funding/ /courses/grant-writing/ /courses/business-plan/ /courses/ecommerce/ /courses/reseller/ /billing/ /terms/ /privacy/ /accessibility/ /onboarding/ /robots.txt /sitemap.xml; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://atechucation.atechspot.com${path}" || true)
            echo "$path -> $code"
          done
          curl -sSI https://atechucation.atechspot.com/ | head -n 20 || true
          echo 'Custom-domain diagnostic complete.'
