name: Inventory Target Ecosystem Sites

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inventory-target-sites.yml'
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inventory Pages and Workers for requested properties
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')

          echo '=== MATCHING WORKER DOMAINS ==='
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" "${auth[@]}" \
            | jq '{success,errors,result:[.result[]? | select((.hostname|ascii_downcase|test("techguru|hazilflix|mraplus|portfolio|hazil|atechucationfigures|atechnetwork|royalup")) or (.service|ascii_downcase|test("techguru|hazil|portfolio|figures|network|royal"))) | {hostname,service,environment,zone_id,id}]}'

          echo '=== MATCHING WORKER SCRIPTS ==='
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" "${auth[@]}" \
            | jq '{success,errors,result:[.result[]? | select(.id|ascii_downcase|test("techguru|hazilflix|hazil|mraplus|portfolio|figures|network|royal")) | {id,created_on,modified_on}]}'

          echo '=== MATCHING PAGES PROJECTS ==='
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects?per_page=100" "${auth[@]}" \
            | jq '{success,errors,result:[.result[]? | select(.name|ascii_downcase|test("techguru|hazilflix|hazil|mraplus|portfolio|figures|network|royal")) | {name,subdomain,production_branch,created_on,domains}]}'
