name: Probe Royal Up and Deploy Figures

on:
  push:
    branches: [main]
    paths:
      - 'ATechucation-Figures-Website/**'
      - '.github/workflows/probe-royalup-and-deploy-figures.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Probe known Royal Up production deployments
        shell: bash
        run: |
          set +e
          urls=(
            "https://aa900db6.royalupwiththehughes.pages.dev"
            "https://851eae33.royalupwiththehughes.pages.dev"
            "https://605e440a.royalupwiththehughes.pages.dev"
            "https://106f9245.royalupwiththehughes.pages.dev"
            "https://372d291d.royalupwiththehughes.pages.dev"
            "https://fbb62d5c.royalupwiththehughes.pages.dev"
            "https://4cf850a5.royalupwiththehughes.pages.dev"
          )
          for url in "${urls[@]}"; do
            for path in "/" "/index.html"; do
              code=$(curl -L -sS --max-time 15 -o /tmp/body -w '%{http_code}' "$url$path")
              title=$(grep -o -i '<title>[^<]*' /tmp/body 2>/dev/null | head -n1 | sed 's/<title>//I')
              bytes=$(wc -c </tmp/body 2>/dev/null || echo 0)
              echo "$url$path | http=$code | bytes=$bytes | title=$title"
            done
          done
      - name: Release stale Figures DNS records for Worker custom domains
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          zone_json=$(curl -fsS "https://api.cloudflare.com/client/v4/zones?name=atechspot.com&account.id=$CLOUDFLARE_ACCOUNT_ID" "${auth[@]}")
          zone_id=$(echo "$zone_json" | jq -r '.result[0].id // empty')
          test -n "$zone_id"
          api="https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records"
          for host in www.atechucationfigures.atechspot.com atechucationfigures.atechspot.com; do
            records=$(curl -fsS "$api?name=$host" "${auth[@]}")
            mapfile -t ids < <(echo "$records" | jq -r '.result[].id')
            for id in "${ids[@]}"; do
              echo "Deleting stale DNS record for $host: $id"
              curl -fsS -X DELETE "$api/$id" "${auth[@]}" | jq -e '.success == true' >/dev/null
            done
          done

      - name: Deploy A+ Techucation Figures clean alias
        working-directory: ATechucation-Figures-Website
        run: npx --yes wrangler@latest deploy
      - name: Verify Figures ecosystem hostnames
        shell: bash
        run: |
          set -euo pipefail
          sleep 10
          for host in www.atechucationfigures.atechspot.com atechucationfigures.atechspot.com; do
            code=$(curl -L -sS --max-time 20 -o /tmp/figures -w '%{http_code}' "https://${host}/")
            title=$(grep -o -i '<title>[^<]*' /tmp/figures 2>/dev/null | head -n1 | sed 's/<title>//I')
            echo "$host | http=$code | title=$title"
            test "$code" = "200"
            curl -L -fsS --max-time 20 "https://${host}/api/health" >/dev/null
          done
