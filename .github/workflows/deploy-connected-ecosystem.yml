name: Deploy Connected 22-Brand Ecosystem

on:
  push:
    branches: [main]
    paths:
      - 'Ecosystem-Gateway-Website/**'
      - '.github/workflows/deploy-connected-ecosystem.yml'
  workflow_dispatch:

concurrency:
  group: connected-ecosystem-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Cloudflare zone
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          z=$(curl -fsS "https://api.cloudflare.com/client/v4/zones?name=atechspot.com&account.id=$CLOUDFLARE_ACCOUNT_ID" "${auth[@]}")
          zid=$(echo "$z" | jq -r '.result[0].id // empty')
          test -n "$zid"
          echo "ZONE_ID=$zid" >> "$GITHUB_ENV"

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          node --check Ecosystem-Gateway-Website/worker.js
          jq -e '.routes | length == 10' Ecosystem-Gateway-Website/wrangler.jsonc >/dev/null

      - name: Deploy shared customer operations gateway
        working-directory: Ecosystem-Gateway-Website
        run: npx --yes wrangler@latest deploy

      - name: Certify eight shared customer systems
        shell: bash
        run: |
          set -euo pipefail
          sleep 12

          assert_redirect() {
            host="$1"; expected="$2"
            headers=$(curl -sS -D - -o /dev/null --max-time 20 "https://$host/")
            code=$(printf '%s' "$headers" | awk 'toupper($1) ~ /^HTTP\// {c=$2} END{print c}')
            location=$(printf '%s' "$headers" | awk 'BEGIN{IGNORECASE=1} /^location:/ {$1=""; sub(/^ /,""); gsub(/\r/,""); print; exit}')
            case "$code" in 301|302|303|307|308) ;; *) echo "$host expected redirect, got $code"; exit 1;; esac
            [ "$location" = "$expected" ] || { echo "$host redirect mismatch: $location"; exit 1; }
            echo "GREEN redirect | $host -> $location"
          }

          assert_page() {
            url="$1"; needle="$2"
            curl -fsS -L --max-time 25 -o /tmp/page "$url"
            grep -Fq "$needle" /tmp/page || { echo "$url missing expected content: $needle"; exit 1; }
            echo "GREEN page | $url"
          }

          assert_redirect "book.atechspot.com" "https://www.atechspot.com/booking/"
          assert_redirect "pay.atechspot.com" "https://www.atechspot.com/payments/"
          assert_redirect "intake.atechspot.com" "https://www.atechspot.com/intake/"
          assert_redirect "clients.atechspot.com" "https://account.atechspot.com/clients/"

          assert_page "https://account.atechspot.com/" "SECURE CLIENT ACCESS"
          assert_page "https://support.atechspot.com/" "Get to the right help quickly."
          assert_page "https://help.atechspot.com/" "Answers before you need a ticket."
          assert_page "https://status.atechspot.com/" "Customer operations availability."

          curl -fsS -L --max-time 25 -o /tmp/status https://status.atechspot.com/
          for label in "Booking" "Pay" "Intake" "Client Portal" "Account" "Support Center" "Help Center" "Status"; do
            grep -Fq "$label" /tmp/status || { echo "Status page missing $label"; exit 1; }
          done
          if grep -Fq "Needs review" /tmp/status; then
            echo "One or more shared customer systems are not green."
            exit 1
          fi

          for url in             https://support.atechspot.com/             https://help.atechspot.com/             https://status.atechspot.com/; do
            curl -fsSI --max-time 20 "$url" > /tmp/headers
            grep -qi '^x-content-type-options: nosniff' /tmp/headers
            grep -qi '^x-frame-options: DENY' /tmp/headers
            grep -qi '^content-security-policy:' /tmp/headers
            grep -qi '^strict-transport-security:' /tmp/headers
          done

          echo "EIGHT_SHARED_SYSTEMS=GREEN"

      - name: Attach Ops hostname to existing Ops Worker
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          scripts=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" "${auth[@]}")
          echo "$scripts" | jq -e '.result[] | select(.id=="ops-atechspot")' >/dev/null
          body=$(jq -nc --arg hostname "ops.atechspot.com" --arg service "ops-atechspot" --arg zone "$ZONE_ID" --arg zone_name "atechspot.com" '{hostname:$hostname,service:$service,zone_id:$zone,zone_name:$zone_name}')
          curl -fsS -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" "${auth[@]}" --data "$body" | jq -e '.success == true' >/dev/null

      - name: Preserve independently managed public properties
        shell: bash
        run: |
          echo 'Royal Up and A+ Techucation Figures are deployed by their dedicated rollback/deploy workflows.'
          echo 'This shared operating-gateway workflow must not mutate those public-brand deployments.'

      - name: Verify connected operating domains
        shell: bash
        run: |
          set +e
          sleep 12
          urls=(
            "https://start.atechspot.com/"
            "https://intake.atechspot.com/"
            "https://book.atechspot.com/"
            "https://clients.atechspot.com/"
            "https://pay.atechspot.com/"
            "https://support.atechspot.com/"
            "https://help.atechspot.com/"
            "https://shop.atechspot.com/"
            "https://status.atechspot.com/"
            "https://partners.atechspot.com/"
            "https://vendors.atechspot.com/"
            "https://press.atechspot.com/"
            "https://developers.atechspot.com/"
            "https://ops.atechspot.com/growthcare"
            "https://ops.atechspot.com/assessment"
            "https://royalupwiththehughes.atechspot.com/"
            "https://www.atechucationfigures.atechspot.com/"
            "https://figures.atechspot.com/"
            "https://atechucationfigures.atechspot.com/"
            "https://atechnetwork.atechspot.com/"
            "https://warriorj.atechspot.com/"
          )
          failures=0
          for url in "${urls[@]}"; do
            rm -f /tmp/body
            code=$(curl -L -sS --max-time 20 -o /tmp/body -w '%{http_code}' "$url")
            rc=$?
            title=$(grep -o -i '<title>[^<]*' /tmp/body 2>/dev/null | head -n1 | sed 's/<title>//I')
            printf '%s | curl=%s | http=%s | title=%s\n' "$url" "$rc" "$code" "$title"
            case "$code" in 200|201|202|204|301|302|303|307|308|401|403) ;; *) failures=$((failures+1));; esac
          done
          echo "Verification review count: $failures"
          exit 0
