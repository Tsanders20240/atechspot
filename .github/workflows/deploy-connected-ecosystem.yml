name: Deploy Connected 22-Brand Ecosystem

on:
  push:
    branches: [main]
    paths:
      - 'Ecosystem-Gateway-Website/**'
      - 'ATechucation-Figures-Website/**'
      - '.github/workflows/deploy-connected-ecosystem.yml'
  workflow_dispatch:

concurrency:
  group: connected-ecosystem-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Cloudflare zone
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          z=$(curl -fsS "https://api.cloudflare.com/client/v4/zones?name=atechspot.com&account.id=$CLOUDFLARE_ACCOUNT_ID" "${auth[@]}")
          zid=$(echo "$z" | jq -r '.result[0].id // empty')
          test -n "$zid"
          echo "ZONE_ID=$zid" >> "$GITHUB_ENV"

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          node --check Ecosystem-Gateway-Website/worker.js
          node --check ATechucation-Figures-Website/worker.js
          jq -e '.routes | length == 9' Ecosystem-Gateway-Website/wrangler.jsonc >/dev/null
          jq -e '.routes | length == 2' ATechucation-Figures-Website/wrangler.jsonc >/dev/null

      - name: Deploy shared customer operations gateway
        working-directory: Ecosystem-Gateway-Website
        run: npx --yes wrangler@latest deploy

      - name: Attach Ops hostname to existing Ops Worker
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          scripts=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" "${auth[@]}")
          echo "$scripts" | jq -e '.result[] | select(.id=="ops-atechspot")' >/dev/null
          body=$(jq -nc --arg hostname "ops.atechspot.com" --arg service "ops-atechspot" --arg zone "$ZONE_ID" --arg zone_name "atechspot.com" '{hostname:$hostname,service:$service,zone_id:$zone,zone_name:$zone_name}')
          curl -fsS -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" "${auth[@]}" --data "$body" | jq -e '.success == true' >/dev/null

      - name: Roll back Royal Up to previous successful production deployment
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          project="royalupwiththehughes"
          deployments=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project/deployments?per_page=50" "${auth[@]}")
          mapfile -t ids < <(echo "$deployments" | jq -r '.result[] | select(.environment=="production" and .latest_stage.status=="success") | .id' | head -n 2)
          if [ "${#ids[@]}" -ge 2 ]; then
            target="${ids[1]}"
            echo "Rolling back Royal Up to prior successful production deployment $target"
            curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project/deployments/$target/rollback" "${auth[@]}" --data '{}' | jq -e '.success == true' >/dev/null
          else
            echo "No earlier successful production deployment available; leaving current production unchanged."
          fi

      - name: Restore Royal Up custom domain
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          project="royalupwiththehughes"
          domain="royalupwiththehughes.atechspot.com"
          domains=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project/domains" "${auth[@]}")
          if echo "$domains" | jq -e --arg d "$domain" '.result[] | select(.name==$d)' >/dev/null; then
            echo "Royal Up domain already attached."
          else
            curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project/domains" "${auth[@]}" --data "$(jq -nc --arg name "$domain" '{name:$name}')" | jq -e '.success == true' >/dev/null
          fi

      - name: Deploy A+ Techucation Figures
        continue-on-error: true
        working-directory: ATechucation-Figures-Website
        run: npx --yes wrangler@latest deploy

      - name: Verify connected operating domains
        shell: bash
        run: |
          set +e
          sleep 12
          urls=(
            "https://start.atechspot.com/"
            "https://intake.atechspot.com/"
            "https://book.atechspot.com/"
            "https://pay.atechspot.com/"
            "https://support.atechspot.com/"
            "https://help.atechspot.com/"
            "https://shop.atechspot.com/"
            "https://status.atechspot.com/"
            "https://partners.atechspot.com/"
            "https://vendors.atechspot.com/"
            "https://press.atechspot.com/"
            "https://developers.atechspot.com/"
            "https://ops.atechspot.com/growthcare"
            "https://ops.atechspot.com/assessment"
            "https://royalupwiththehughes.atechspot.com/"
            "https://www.atechucationfigures.atechspot.com/"
            "https://atechucationfigures.atechspot.com/"
            "https://atechnetwork.atechspot.com/"
            "https://warriorj.atechspot.com/"
          )
          failures=0
          for url in "${urls[@]}"; do
            rm -f /tmp/body
            code=$(curl -L -sS --max-time 20 -o /tmp/body -w '%{http_code}' "$url")
            rc=$?
            title=$(grep -o -i '<title>[^<]*' /tmp/body 2>/dev/null | head -n1 | sed 's/<title>//I')
            printf '%s | curl=%s | http=%s | title=%s\n' "$url" "$rc" "$code" "$title"
            case "$code" in 200|201|202|204|301|302|303|307|308|401|403) ;; *) failures=$((failures+1));; esac
          done
          echo "Verification review count: $failures"
          exit 0
