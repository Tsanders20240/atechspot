name: Deploy Vision of Sanders

on:
  push:
    branches: [main]
    paths:
      - 'Vision-of-Sanders-Website/**'
      - '.github/workflows/deploy-vision-of-sanders.yml'
  workflow_dispatch:

concurrency:
  group: vision-of-sanders-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Build production portfolio
        working-directory: Vision-of-Sanders-Website
        shell: bash
        run: |
          set -euo pipefail
          node build.mjs
          test -f public/index.html
          ! grep -q '__IMG' public/index.html
          grep -q 'VISION OF SANDERS' public/index.html
          grep -q 'Shot on' public/index.html
          grep -q '/api/inquiry' public/index.html
          node --check worker.js

      - name: Deploy to Cloudflare Workers
        working-directory: Vision-of-Sanders-Website
        run: npx --yes wrangler@latest deploy

      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          sleep 15
          curl -fsS --retry 4 --retry-delay 5 https://visionofsanders.atechspot.com/api/health | tee /tmp/health.json
          jq -e '.ok == true and .property == "Vision of Sanders"' /tmp/health.json
          curl -fsS --retry 4 --retry-delay 5 https://visionofsanders.atechspot.com/ | grep -q 'See it.'
          curl -fsSI --retry 4 --retry-delay 5 https://visionofsanders.atechspot.com/ | grep -qi 'x-content-type-options: nosniff'
