# Copy the relevant binding values into the Cloudflare Pages project settings.
# Do not commit production secrets.

name = "atechspot"
compatibility_date = "2026-09-19"

[[d1_databases]]
binding = "DB"
database_name = "atechspot-phase2"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"

[vars]
AUTH_BASE_URL = "https://account.atechspot.com"
AUTH_FROM_EMAIL = "REPLACE_WITH_VERIFIED_SENDER"
# BOOTSTRAP_ADMIN_EMAIL should be configured as a protected environment variable
# rather than committed here.
# RESEND_API_KEY must be stored as a secret.
